<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QD Mobile Ultimate v3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --primary: #6366f1;
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --text-main: #0f172a;
            --text-dim: #64748b;
            --border: #f1f5f9;
            --chat-me: #6366f1;
            --danger: #ff4757;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); color: var(--text-main); 
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden; transition: 0.3s; 
        }

        /* --- HEADER --- */
        header { 
            padding: 55px 20px 15px; background: var(--surface); 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border); z-index: 1000;
        }
        .brand { font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        .header-actions { display: flex; gap: 10px; }
        .icon-btn { 
            background: var(--bg); border: 1px solid var(--border); 
            width: 40px; height: 40px; border-radius: 12px; 
            color: var(--text-main); cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 18px; 
        }

        /* --- TRANG CHỦ & LỜI CHÀO --- */
        main { flex: 1; overflow-y: auto; position: relative; }
        .page { display: none; padding: 20px; height: 100%; animation: slideUp 0.4s ease; }
        .page.active { display: block; }
        
        .welcome-card {
            background: var(--surface); padding: 25px; border-radius: 30px;
            text-align: center; border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); margin-bottom: 20px;
        }
        .greeting { font-size: 14px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }
        .user-name { font-size: 26px; font-weight: 800; margin: 0; background: var(--primary-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* --- CARDS --- */
        .card { 
            background: var(--surface); padding: 16px; border-radius: 22px; 
            border: 1px solid var(--border); margin-bottom: 12px; 
            display: flex; align-items: center; gap: 15px; transition: 0.2s;
        }
        .card:active { transform: scale(0.97); background: var(--bg); }

        /* --- CHAT WINDOW --- */
        #chat-window { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; }
        #chat-window.active { display: flex; animation: slideInRight 0.3s ease; }
        .chat-header { padding: 55px 15px 15px; background: var(--surface); border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 50px 1fr 50px; align-items: center; }
        .chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.4; position: relative; }
        .msg.me { align-self: flex-end; background: var(--chat-me); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px -3px var(--chat-me); }
        .msg.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

        /* --- CHAT SETTINGS --- */
        #chat-settings { 
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%; 
            background: var(--surface); z-index: 2100; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            padding: 55px 25px 25px; 
        }
        #chat-settings.open { right: 0; }
        .color-dot { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.2s; }
        .color-dot.active { border-color: var(--text-main); transform: scale(1.15); }

        /* --- MODAL --- */
        #logout-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 5000;
            display: none; align-items: center; justify-content: center; padding: 25px; backdrop-filter: blur(8px);
        }
        .modal-box {
            background: var(--surface); width: 100%; max-width: 320px; border-radius: 30px;
            padding: 30px; text-align: center; border: 1px solid var(--border);
        }
        .btn { padding: 15px; border-radius: 16px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; flex: 1; }
        .btn-confirm { background: var(--danger); color: white; }
        .btn-cancel { background: var(--bg); color: var(--text-main); }

        /* --- TAB BAR --- */
        .tab-bar { 
            background: var(--surface); height: calc(70px + var(--safe-bottom)); 
            display: flex; border-top: 1px solid var(--border); padding-bottom: var(--safe-bottom);
        }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--text-dim); font-size: 11px; font-weight: 700; }
        .tab-item.active { color: var(--primary); }
        .tab-item i { font-size: 20px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <header>
        <div class="brand">QD MOBILE</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleTheme()">🌓</button>
            <button class="icon-btn" style="color:var(--danger)" onclick="showLogout()">🔒</button>
        </div>
    </header>

    <main>
        <div id="home" class="page active">
            <div class="welcome-card">
                <div id="avtHome" style="width:80px; height:80px; background:var(--primary-grad); border-radius:28px; margin:0 auto 15px; display:flex; align-items:center; justify-content:center; color:white; font-size:32px; font-weight:800; box-shadow: 0 10px 20px rgba(99,102,241,0.3);">?</div>
                <div class="greeting" id="txtGreeting">Chào bạn,</div>
                <h2 class="user-name" id="txtName">Người dùng</h2>
            </div>
            
            <div class="card" style="background:var(--primary-grad); color:white; border:none; display:block">
                <div style="font-weight:800; margin-bottom:4px">Hệ thống Quân Đoàn</div>
                <div style="font-size:13px; opacity:0.9">Phiên bản v3.0 đã sẵn sàng. Chúc bạn có trải nghiệm tốt nhất!</div>
            </div>
        </div>

        <div id="contacts" class="page">
            <h3 style="margin:0 0 20px; font-weight:800; font-size:24px">Trò chuyện</h3>
            <div id="contactList"></div>
        </div>

        <div id="news" class="page">
            <h3 style="margin:0 0 20px; font-weight:800; font-size:24px">Bản tin</h3>
            <div id="newsList"></div>
        </div>
    </main>

    <div id="logout-modal">
        <div class="modal-box">
            <div style="font-size:45px; margin-bottom:15px">🚪</div>
            <h3 style="margin:0">Đăng xuất?</h3>
            <p style="color:var(--text-dim); font-size:14px; margin:10px 0 25px">Hành động này sẽ đưa bạn quay lại màn hình đăng nhập.</p>
            <div style="display:flex; gap:12px">
                <button class="btn btn-cancel" onclick="hideLogout()">Hủy</button>
                <button class="btn btn-confirm" onclick="doLogout()">Đăng xuất</button>
            </div>
        </div>
    </div>

    <div id="chat-window">
        <div class="chat-header">
            <button class="icon-btn" onclick="closeChat()">✕</button>
            <div id="chatTitle" style="text-align:center; font-weight:800; font-size:17px">...</div>
            <button class="icon-btn" onclick="openSettings()">⚙️</button>
        </div>
        <div class="chat-body" id="chatDisplay"></div>
        <div style="padding:10px 15px; display:flex; gap:10px; background:var(--surface); border-top:1px solid var(--border); padding-bottom:calc(10px + var(--safe-bottom))">
            <input type="text" id="msgInput" placeholder="Aa..." style="flex:1; padding:14px 20px; border-radius:30px; border:1px solid var(--border); background:var(--bg); color:var(--text-main); font-size:16px">
            <button onclick="sendMsg()" style="width:48px; height:48px; border-radius:50%; background:var(--chat-me); color:white; border:none; font-size:20px">➤</button>
        </div>

        <div id="chat-settings">
            <div style="display:flex; align-items:center; gap:15px; margin-bottom:30px">
                <button class="icon-btn" onclick="closeSettings()">←</button>
                <h3 style="margin:0; font-weight:800">Tùy chỉnh chat</h3>
            </div>
            <div style="margin-bottom:25px">
                <label style="display:block; font-size:11px; font-weight:800; color:var(--text-dim); margin-bottom:10px; letter-spacing:1px">BIỆT DANH</label>
                <input type="text" id="nickInput" style="width:100%; padding:15px; border-radius:15px; border:1px solid var(--border); background:var(--bg); color:var(--text-main); font-size:16px">
            </div>
            <div>
                <label style="display:block; font-size:11px; font-weight:800; color:var(--text-dim); margin-bottom:15px; letter-spacing:1px">MÀU CHỦ ĐỀ</label>
                <div id="colorPicker" style="display:flex; gap:12px; flex-wrap:wrap"></div>
            </div>
            <button onclick="saveChatSettings()" style="width:100%; padding:18px; border-radius:20px; border:none; background:var(--primary-grad); color:white; font-weight:800; margin-top:40px; box-shadow: 0 10px 20px rgba(99,102,241,0.2)">Lưu thay đổi</button>
        </div>
    </div>

    <nav class="tab-bar">
        <div class="tab-item active" onclick="switchTab('home', this)"><i>🏠</i><span>Trang chủ</span></div>
        <div class="tab-item" onclick="switchTab('contacts', this)"><i>💬</i><span>Tin nhắn</span></div>
        <div class="tab-item" onclick="switchTab('news', this)"><i>📰</i><span>Bản tin</span></div>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ", 
            authDomain: "web-dangky-123.firebaseapp.com", 
            projectId: "web-dangky-123" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const currentUser = JSON.parse(localStorage.getItem("chat_user"));
        if (!currentUser) window.location.href = "index.html";

        // Logic Trang Chủ
        function initHome() {
            document.getElementById("txtName").innerText = currentUser.name;
            document.getElementById("avtHome").innerText = currentUser.name.charAt(0).toUpperCase();
            const h = new Date().getHours();
            let g = h < 11 ? "Chào buổi sáng ☀️" : h < 18 ? "Chào buổi chiều 🌤️" : "Chào buổi tối 🌙";
            document.getElementById("txtGreeting").innerText = g + ",";
        }
        initHome();

        let selectedId = null;
        let chatSnap = null;
        let activeColor = "#6366f1";
        const themeColors = ["#6366f1", "#ec4899", "#10b981", "#f59e0b", "#06b6d4", "#f43f5e", "#8b5cf6", "#1e293b"];

        function switchTab(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            if(id === 'contacts') loadContacts();
            if(id === 'news') loadNews();
        }

        function loadContacts() {
            db.collection("accounts").get().then(snap => {
                const list = document.getElementById("contactList");
                const nicks = JSON.parse(localStorage.getItem("nicknames") || "{}");
                list.innerHTML = "";
                snap.forEach(doc => {
                    const u = doc.data().user;
                    if(u !== currentUser.id) {
                        const name = nicks[u] || u;
                        list.innerHTML += `
                        <div class="card" onclick="openChat('${u}')">
                            <div style="width:50px; height:50px; background:var(--primary-grad); border-radius:16px; display:flex; align-items:center; justify-content:center; color:white; font-weight:800; font-size:20px">${name.charAt(0).toUpperCase()}</div>
                            <div style="flex:1">
                                <div style="font-weight:800; font-size:16px">${name}</div>
                                <div style="font-size:12px; color:var(--text-dim)">Nhấn để bắt đầu chat</div>
                            </div>
                            <div style="color:var(--text-dim); font-size:18px">›</div>
                        </div>`;
                    }
                });
            });
        }

        function openChat(id) {
            selectedId = id;
            const nicks = JSON.parse(localStorage.getItem("nicknames") || "{}");
            const themes = JSON.parse(localStorage.getItem("chat_themes") || "{}");
            activeColor = themes[id] || "#6366f1";
            
            document.documentElement.style.setProperty('--chat-me', activeColor);
            document.getElementById("chatTitle").innerText = nicks[id] || id;
            document.getElementById("chat-window").classList.add("active");

            if(chatSnap) chatSnap();
            chatSnap = db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
                const disp = document.getElementById("chatDisplay");
                disp.innerHTML = "";
                snap.forEach(doc => {
                    const m = doc.data();
                    if((m.from === currentUser.id && m.to === id) || (m.from === id && m.to === currentUser.id)) {
                        disp.innerHTML += `<div class="msg ${m.from === currentUser.id ? 'me' : 'them'}">${m.text}</div>`;
                    }
                });
                disp.scrollTop = disp.scrollHeight;
            });
        }

        function openSettings() {
            const panel = document.getElementById("chat-settings");
            panel.classList.add("open");
            const nicks = JSON.parse(localStorage.getItem("nicknames") || "{}");
            document.getElementById("nickInput").value = nicks[selectedId] || "";
            
            const picker = document.getElementById("colorPicker");
            picker.innerHTML = "";
            themeColors.forEach(c => {
                const dot = document.createElement("div");
                dot.className = `color-dot ${c === activeColor ? 'active' : ''}`;
                dot.style.backgroundColor = c;
                dot.onclick = () => {
                    activeColor = c;
                    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                    dot.classList.add('active');
                };
                picker.appendChild(dot);
            });
        }

        function saveChatSettings() {
            const nick = document.getElementById("nickInput").value.trim();
            const nicks = JSON.parse(localStorage.getItem("nicknames") || "{}");
            const themes = JSON.parse(localStorage.getItem("chat_themes") || "{}");
            
            nicks[selectedId] = nick;
            themes[selectedId] = activeColor;
            
            localStorage.setItem("nicknames", JSON.stringify(nicks));
            localStorage.setItem("chat_themes", JSON.stringify(themes));
            
            document.documentElement.style.setProperty('--chat-me', activeColor);
            document.getElementById("chatTitle").innerText = nick || selectedId;
            closeSettings();
            loadContacts();
        }

        function closeSettings() { document.getElementById("chat-settings").classList.remove("open"); }
        function closeChat() { document.getElementById("chat-window").classList.remove("active"); if(chatSnap) chatSnap(); }

        function sendMsg() {
            const input = document.getElementById("msgInput");
            const txt = input.value.trim();
            if(txt && selectedId) {
                db.collection("messages").add({ from: currentUser.id, to: selectedId, text: txt, time: Date.now() });
                input.value = "";
            }
        }

        function loadNews() {
            db.collection("news").orderBy("time", "desc").onSnapshot(snap => {
                const list = document.getElementById("newsList");
                list.innerHTML = "";
                snap.forEach(doc => {
                    const n = doc.data();
                    list.innerHTML += `<div class="card" style="display:block; padding:20px"><div style="font-weight:800; margin-bottom:8px; font-size:17px">${n.title}</div><div style="font-size:14px; color:var(--text-dim); line-height:1.5">${n.content}</div></div>`;
                });
            });
        }

        function showLogout() { document.getElementById("logout-modal").style.display = "flex"; }
        function hideLogout() { document.getElementById("logout-modal").style.display = "none"; }
        function doLogout() { localStorage.removeItem("chat_user"); window.location.href = "index.html"; }
        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute("data-theme");
            body.setAttribute("data-theme", current === "dark" ? "light" : "dark");
        }

        document.getElementById("msgInput").onkeypress = (e) => { if(e.key === "Enter") sendMsg(); };
    </script>
</body>
</html>
