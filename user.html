<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>QD Mobile Ultimate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --primary: #4f46e5;
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            --text-main: #0f172a;
            --text-dim: #64748b;
            --border: #f1f5f9;
            --bubble-me: #4f46e5;
            --bubble-them: #ffffff;
            --safe-bottom: env(safe-area-inset-bottom);
        }

        [data-theme="dark"] {
            --bg: #020617;
            --surface: #0f172a;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: #1e293b;
            --bubble-me: #6366f1;
            --bubble-them: #1e293b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            margin: 0; font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg); color: var(--text-main);
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* HEADER CHÍNH */
        header {
            padding: 50px 20px 15px; background: var(--surface);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .brand { font-size: 22px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }

        /* VÙNG NỘI DUNG */
        main { flex: 1; overflow-y: auto; position: relative; }
        .page { display: none; padding: 20px; height: 100%; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* CỬA SỔ CHAT TOÀN MÀN HÌNH */
        #chat-window {
            position: fixed; inset: 0; background: var(--bg); z-index: 2000;
            display: none; flex-direction: column; height: 100%;
        }
        #chat-window.active { display: flex; }

        .chat-header {
            padding: 50px 20px 15px; background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 15px; flex-shrink: 0;
        }

        .chat-body {
            flex: 1; overflow-y: auto; padding: 15px;
            display: flex; flex-direction: column; gap: 10px;
            scroll-behavior: smooth;
        }

        /* TIN NHẮN */
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; }
        .msg.me { align-self: flex-end; background: var(--primary-grad); color: white; border-bottom-right-radius: 4px; }
        .msg.them { align-self: flex-start; background: var(--surface); color: var(--text-main); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

        /* THANH NHẬP TIN NHẮN - CẢI TIẾN CHO BÀN PHÍM */
        .msg-input-container {
            background: var(--surface);
            padding: 10px 15px;
            display: flex; align-items: center; gap: 10px;
            border-top: 1px solid var(--border);
            padding-bottom: calc(10px + var(--safe-bottom));
            flex-shrink: 0;
            z-index: 2100;
        }

        .msg-input-container input {
            flex: 1; background: var(--bg); border: 1px solid var(--border);
            padding: 12px 18px; border-radius: 25px; color: var(--text-main);
            font-size: 16px; /* 16px chống tự zoom trên iOS */
        }

        .send-btn {
            background: var(--primary-grad); border: none; width: 45px; height: 45px;
            border-radius: 50%; color: white; display: flex; align-items: center;
            justify-content: center; font-size: 18px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }

        /* TAB BAR */
        .tab-bar {
            background: var(--surface); height: calc(65px + var(--safe-bottom));
            display: flex; border-top: 1px solid var(--border); flex-shrink: 0;
        }
        .tab-item {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 4px; color: var(--text-dim); font-size: 11px; font-weight: 600;
        }
        .tab-item.active { color: var(--primary); }
        .tab-item span:first-child { font-size: 22px; }

        /* NÚT & THÀNH PHẦN PHỤ */
        .icon-btn { background: var(--bg); border: none; padding: 10px; border-radius: 12px; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .user-card { background: var(--surface); padding: 15px; border-radius: 20px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; border: 1px solid var(--border); cursor: pointer; }
        .user-card:active { transform: scale(0.97); }
    </style>
</head>
<body data-theme="light">

    <header id="main-header">
        <div class="brand">QD MOBILE</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleTheme()">🌓</button>
            <button class="icon-btn" onclick="openLogout()" style="color:#ef4444">🔒</button>
        </div>
    </header>

    <main>
        <div id="home" class="page active">
            <div style="text-align: center; margin-top: 30px;">
                <div id="avatarImg" style="width: 90px; height: 90px; background: var(--primary-grad); border-radius: 30px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 36px; font-weight: 800; box-shadow: 0 10px 25px rgba(79,70,229,0.3);">?</div>
                <h2 id="userName" style="margin: 0; font-weight: 800;">-</h2>
                <p style="color: var(--text-dim); font-size: 14px; margin-top: 8px;">Thành viên Quân Đoàn</p>
            </div>
            
            <div style="margin-top: 30px; background: var(--primary-grad); padding: 25px; border-radius: 30px; color: white;">
                <h3 style="margin: 0 0 10px;">Chào mừng bạn!</h3>
                <p style="margin: 0; opacity: 0.9; font-size: 14px; line-height: 1.5;">Hệ thống đã sẵn sàng. Bạn có thể bắt đầu trò chuyện với mọi người ngay bây giờ.</p>
            </div>
        </div>

        <div id="contacts" class="page">
            <h3 style="margin-top: 0; font-size: 24px; font-weight: 800;">Tin nhắn</h3>
            <div id="contactList"></div>
        </div>

        <div id="news" class="page">
            <h3 style="margin-top: 0; font-size: 24px; font-weight: 800;">Bản tin</h3>
            <div id="newsFeed"></div>
        </div>
    </main>

    <div id="chat-window">
        <div class="chat-header">
            <button class="icon-btn" onclick="closeChat()" style="font-weight: bold;">✕</button>
            <div style="font-weight: 700; font-size: 18px;" id="chattingWith">Đang kết nối...</div>
        </div>
        
        <div class="chat-body" id="chatDisplay"></div>
        
        <div class="msg-input-container" id="inputArea">
            <input type="text" id="msgInput" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>

    <nav class="tab-bar">
        <div class="tab-item active" onclick="switchTab('home', this)"><span>🏠</span><span>Chủ</span></div>
        <div class="tab-item" onclick="switchTab('contacts', this)"><span>💬</span><span>Chat</span></div>
        <div class="tab-item" onclick="switchTab('news', this)"><span>📰</span><span>Tin</span></div>
    </nav>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
    // --- CẤU HÌNH FIREBASE ---
    const firebaseConfig = { 
        apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ", 
        authDomain: "web-dangky-123.firebaseapp.com", 
        projectId: "web-dangky-123" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Kiểm tra đăng nhập
    const currentUser = JSON.parse(localStorage.getItem("chat_user"));
    if (!currentUser) window.location.href = "index.html";

    document.getElementById("userName").innerText = currentUser.name;
    document.getElementById("avatarImg").innerText = currentUser.name.charAt(0).toUpperCase();

    const chatWindow = document.getElementById("chat-window");
    const chatDisplay = document.getElementById("chatDisplay");
    const msgInput = document.getElementById("msgInput");

    // --- ĐIỀU HƯỚNG TAB ---
    function switchTab(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
        if(id === 'contacts') loadContacts();
        if(id === 'news') loadNews();
    }

    // --- LOGIC CHAT ---
    let selectedChatId = "";
    let chatSubscription = null;

    function openChat(id) {
        selectedChatId = id;
        document.getElementById("chattingWith").innerText = id;
        chatWindow.classList.add("active");
        
        if(chatSubscription) chatSubscription(); // Hủy đăng ký cũ nếu có

        chatSubscription = db.collection("messages").orderBy("time", "asc").onSnapshot(snap => {
            chatDisplay.innerHTML = "";
            snap.forEach(doc => {
                let m = doc.data();
                if((m.from === currentUser.id && m.to === selectedChatId) || (m.from === selectedChatId && m.to === currentUser.id)) {
                    const msgDiv = document.createElement("div");
                    msgDiv.className = `msg ${m.from === currentUser.id ? 'me' : 'them'}`;
                    msgDiv.innerText = m.text;
                    chatDisplay.appendChild(msgDiv);
                }
            });
            scrollToBottom();
        });
    }

    function closeChat() { 
        chatWindow.classList.remove("active"); 
        if(chatSubscription) chatSubscription(); 
    }

    function sendMsg() {
        const text = msgInput.value.trim();
        if(!text || !selectedChatId) return;

        db.collection("messages").add({
            from: currentUser.id,
            to: selectedChatId,
            text: text,
            time: Date.now()
        });

        msgInput.value = "";
        
        // GIỮ BÀN PHÍM: Quan trọng nhất để trải nghiệm mượt
        msgInput.focus();
        scrollToBottom();
    }

    function scrollToBottom() {
        setTimeout(() => {
            chatDisplay.scrollTop = chatDisplay.scrollHeight;
        }, 100);
    }

    // --- XỬ LÝ BÀN PHÍM DI ĐỘNG CHUYÊN NGHIỆP ---
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            // Khi bàn phím hiện, visualViewport.height sẽ giảm đi
            // Chúng ta ép chat-window có chiều cao bằng đúng vùng nhìn thấy
            chatWindow.style.height = `${window.visualViewport.height}px`;
            scrollToBottom();
        });
    }

    msgInput.addEventListener("keypress", (e) => { if(e.key === "Enter") sendMsg(); });

    // --- LOAD DỮ LIỆU ---
    function loadContacts() {
        db.collection("accounts").onSnapshot(snap => {
            const list = document.getElementById("contactList");
            list.innerHTML = "";
            snap.forEach(doc => {
                let u = doc.data().user;
                if(u !== currentUser.id) {
                    list.innerHTML += `
                    <div class="user-card" onclick="openChat('${u}')">
                        <div style="width:50px; height:50px; background:var(--primary-grad); border-radius:15px; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:18px;">${u.charAt(0).toUpperCase()}</div>
                        <div style="flex:1">
                            <div style="font-weight:800; font-size:16px;">${u}</div>
                            <div style="font-size:12px; color:var(--text-dim); margin-top:2px;">Nhấn để trò chuyện...</div>
                        </div>
                        <div style="color:var(--primary); font-size:20px;">➤</div>
                    </div>`;
                }
            });
        });
    }

    function loadNews() {
        db.collection("news").orderBy("time", "desc").onSnapshot(snap => {
            const feed = document.getElementById("newsFeed");
            feed.innerHTML = "";
            snap.forEach(doc => {
                feed.innerHTML += `
                <div style="background:var(--surface); padding:18px; border-radius:20px; margin-bottom:12px; border:1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
                    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
                        <span style="background:rgba(79,70,229,0.1); color:var(--primary); font-size:10px; font-weight:800; padding:4px 8px; border-radius:6px;">SYSTEM</span>
                    </div>
                    <div style="font-size:14px; line-height:1.6; color:var(--text-main);">${doc.data().content}</div>
                </div>`;
            });
        });
    }

    // --- DARK MODE & ĐĂNG XUẤT ---
    function toggleTheme() {
        const theme = document.body.getAttribute("data-theme") === "light" ? "dark" : "light";
        document.body.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);
    }
    document.body.setAttribute("data-theme", localStorage.getItem("theme") || "light");

    function openLogout() {
        if(confirm("Bạn có chắc chắn muốn đăng xuất khỏi hệ thống?")) {
            localStorage.removeItem("chat_user");
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
