<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Page</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    background: linear-gradient(135deg,#141e30,#243b55);
    color:white;
}

/* NAVBAR */
.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

.menu{
    display:flex;
    gap:20px;
}

.menu button{
    background:none;
    border:none;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.menu button:hover{
    color:#00ffcc;
}

/* logout */
.logout{
    background:linear-gradient(45deg,#ff512f,#dd2476);
    padding:8px 14px;
    border:none;
    border-radius:10px;
    color:white;
}

/* CONTENT */
.container{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:340px;
    padding:30px;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    text-align:center;
}

.section{ display:none; }
.active{ display:block; }

/* INPUT */
input{
    width:90%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:10px;
}

/* BUTTON */
button.action{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    background:#00ffcc;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="menu">
        <button onclick="showTab('home')">🏠 Trang chính</button>
        <button onclick="showTab('account')">👤 Tài khoản</button>
        <button onclick="showTab('posts')">📝 Bài viết</button>
    </div>

    <button class="logout" onclick="logout()">Đăng xuất</button>
</div>

<!-- CONTENT -->
<div class="container">

    <!-- HOME -->
    <div id="home" class="section active card">
        <h1>👋 Xin chào!</h1>
        <p>Chào mừng bạn</p>
    </div>

    <!-- ACCOUNT -->
    <div id="account" class="section card">
        <h2>👤 Tài khoản</h2>

        <p><b>Tên tài khoản:</b> <span id="user"></span></p>

        <hr>

        <input id="newPass" type="password" placeholder="Nhập mật khẩu mới">
        <button class="action" onclick="changePass()">Đổi mật khẩu</button>
    </div>

    <!-- POSTS -->
    <div id="posts" class="section card">
        <h2>📝 Bài viết</h2>
        <p>Chưa có bài viết</p>
    </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ",
  authDomain: "web-dangky-123.firebaseapp.com",
  projectId: "web-dangky-123",
});

const db = firebase.firestore();

/* GET USER FROM URL */
let username = new URLSearchParams(location.search).get("user");

/* HIỂN THỊ USER NGAY */
document.getElementById("user").innerText = username;

/* LOAD DATA */
function loadUser(){
    db.collection("accounts")
    .where("user","==",username)
    .get()
    .then(snap=>{
        if(snap.empty) return;

        let data = snap.docs[0].data();
    });
}
loadUser();

/* CHANGE PASSWORD */
function changePass(){
    let newPass = document.getElementById("newPass").value;

    if(!newPass){
        alert("Nhập mật khẩu mới!");
        return;
    }

    db.collection("accounts")
    .where("user","==",username)
    .get()
    .then(snap=>{
        snap.forEach(doc=>{
            doc.ref.update({ pass: newPass });
        });

        alert("Đổi mật khẩu thành công!");
        document.getElementById("newPass").value="";
    });
}

/* TABS */
function showTab(tab){
    document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
    document.getElementById(tab).classList.add("active");
}

/* LOGOUT */
function logout(){
    window.location.href="index.html";
}
</script>

</body>
</html>
