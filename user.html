<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quân Đoàn - Khu Vực Thành Viên</title>

    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #f093fb;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0; width: 100%; height: 70px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 25px; box-sizing: border-box;
            z-index: 1000; border-bottom: 1px solid var(--glass-border);
        }

        .menu { display: flex; gap: 15px; }
        .menu-btn {
            background: none; border: none; color: #94a3b8;
            font-weight: 600; cursor: pointer; transition: 0.3s;
            padding: 10px 15px; border-radius: 12px;
        }
        .menu-btn:hover, .menu-btn.active {
            color: var(--primary); background: rgba(0, 242, 254, 0.1);
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1); color: #ef4444;
            border: 1px solid #ef4444; padding: 8px 16px;
            border-radius: 10px; font-weight: bold; cursor: pointer;
        }

        /* Container */
        .main-content {
            height: 100vh; padding-top: 90px;
            display: flex; justify-content: center; align-items: flex-start;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            width: 480px; max-width: 95%;
            padding: 25px; display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .card.active { display: block; animation: slideUp 0.4s ease; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* User Selection Cards */
        .user-list-container {
            display: flex; gap: 12px; overflow-x: auto;
            padding: 10px 5px; margin-bottom: 15px;
            scrollbar-width: none; /* Ẩn scrollbar cho gọn */
        }
        .user-list-container::-webkit-scrollbar { display: none; }

        .user-card {
            min-width: 85px; padding: 12px 5px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 18px; text-align: center;
            cursor: pointer; transition: 0.3s;
        }
        .user-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .user-card.selected {
            background: var(--primary); color: #06213c;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .user-avatar {
            width: 35px; height: 35px; background: rgba(255,255,255,0.1);
            border-radius: 50%; margin: 0 auto 8px;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        .user-card.selected .user-avatar { background: rgba(0,0,0,0.1); }

        /* Chat Box */
        .chat-box {
            height: 350px; overflow-y: auto;
            background: rgba(0,0,0,0.2); border-radius: 15px;
            padding: 15px; display: flex; flex-direction: column; gap: 10px;
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05);
        }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 14px; word-wrap: break-word; }
        .msg.me { align-self: flex-end; background: var(--primary); color: #06213c; border-bottom-right-radius: 2px; }
        .msg.them { align-self: flex-start; background: rgba(255,255,255,0.1); border-bottom-left-radius: 2px; }

        .input-area { display: flex; gap: 10px; }
        .input-area input {
            flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.3); color: white; outline: none;
        }
        .send-btn {
            background: var(--primary); color: #06213c; border: none;
            padding: 0 20px; border-radius: 12px; font-weight: bold; cursor: pointer;
        }

        h2 { margin: 0 0 15px 0; color: var(--primary); font-size: 22px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="menu">
            <button class="menu-btn active" onclick="showTab('home', this)">🏠 Chính</button>
            <button class="menu-btn" onclick="showTab('chat', this)">💬 Chat</button>
            <button class="menu-btn" onclick="showTab('news', this)">📝 Tin Tức</button>
        </div>
        <button class="logout-btn" onclick="logout()">Thoát</button>
    </nav>

    <div class="main-content">
        <div id="home" class="card active">
            <h2>Hệ Thống Quân Đoàn</h2>
            <div style="background: rgba(0,242,254,0.1); padding: 20px; border-radius: 20px; border: 1px solid var(--primary);">
                <p style="margin: 0; font-size: 14px; color: var(--primary);">Xin chào chiến binh,</p>
                <strong id="userName" style="font-size: 24px; text-shadow: 0 0 10px var(--primary);">...</strong>
            </div>
            <p style="color: #94a3b8; font-size: 14px; margin-top: 20px;">Chúc bạn có một ngày leo rank thành công!</p>
        </div>

        <div id="chat" class="card">
            <h2>💬 Hội Quân</h2>
            <div class="user-list-container" id="userCards">
                </div>
            <div class="chat-box" id="chatBox">
                <p style="text-align:center; color: #475569; margin-top:150px;">Chọn một đồng đội để bắt đầu</p>
            </div>
            <div class="input-area">
                <input id="msgInput" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button class="send-btn" onclick="sendMsg()">GỬI</button>
            </div>
        </div>

        <div id="news" class="card">
            <h2>📝 Bản Tin Quân Đoàn</h2>
            <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; border-left: 4px solid var(--accent);">
                <strong>Thông báo:</strong> Hiện tại chưa có bài viết mới.
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ",
            authDomain: "web-dangky-123.firebaseapp.com",
            projectId: "web-dangky-123",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // CHUYÊN TRANG ĐĂNG NHẬP
        const rawData = localStorage.getItem("chat_user");
        if (!rawData) window.location.href = "index.html";
        const currentUser = JSON.parse(rawData);
        document.getElementById("userName").innerText = currentUser.name;

        let currentTarget = "";
        let chatUnsubscribe = null;

        function showTab(tabId, btn) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            if(tabId === 'chat') loadUserCards();
        }

        // TẢI DANH SÁCH THÀNH VIÊN DẠNG THẺ
        function loadUserCards() {
            const container = document.getElementById("userCards");
            db.collection("accounts").onSnapshot(snap => {
                container.innerHTML = '';
                snap.forEach(doc => {
                    let u = doc.data().user;
                    if (u !== currentUser.id) {
                        const card = document.createElement("div");
                        card.className = `user-card ${currentTarget === u ? 'selected' : ''}`;
                        card.onclick = () => {
                            currentTarget = u;
                            loadUserCards(); // Để cập nhật trạng thái selected
                            startChat();
                        };
                        card.innerHTML = `
                            <div class="user-avatar">${u.charAt(0).toUpperCase()}</div>
                            <div class="user-name" style="font-size:11px; font-weight:bold;">${u}</div>
                        `;
                        container.appendChild(card);
                    }
                });
            });
        }

        // CHAT REAL-TIME
        function startChat() {
            const box = document.getElementById("chatBox");
            if (chatUnsubscribe) chatUnsubscribe();

            chatUnsubscribe = db.collection("messages")
                .orderBy("time", "asc")
                .onSnapshot(snap => {
                    box.innerHTML = "";
                    snap.forEach(doc => {
                        let m = doc.data();
                        if ((m.from === currentUser.id && m.to === currentTarget) || 
                            (m.from === currentTarget && m.to === currentUser.id)) {
                            let isMe = m.from === currentUser.id;
                            box.innerHTML += `<div class="msg ${isMe ? 'me' : 'them'}">${m.text}</div>`;
                        }
                    });
                    box.scrollTop = box.scrollHeight;
                });
        }

        function sendMsg() {
            let input = document.getElementById("msgInput");
            let text = input.value.trim();
            if (!text || !currentTarget) return;

            db.collection("messages").add({
                from: currentUser.id,
                to: currentTarget,
                text: text,
                time: Date.now()
            }).then(() => { input.value = ""; });
        }

        function logout() {
            localStorage.removeItem("chat_user");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
