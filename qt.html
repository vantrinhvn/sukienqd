<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="QD Elite - Vòng Quay May Mắn (Lucky Wheel System)">
    <meta name="robots" content="noindex, nofollow">
    
    <title>QD Elite - Vòng Quay Thưởng v1.5</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <style>
        /* ---------------------------------------------------------------------
           1. CSS VARIABLES (DESIGN SYSTEM TOKENS)
           --------------------------------------------------------------------- */
        :root {
            --brand-primary: #4f46e5;
            --brand-primary-hover: #4338ca;
            --color-warning: #f59e0b;
            --color-success: #10b981;
            --color-danger: #ef4444;
            --color-info: #0ea5e9;

            --bg-body: #09090b;
            --bg-surface: #121217;
            --bg-elevated: #1e1e26;
            --border-strong: #3f3f46;
            
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            
            --radius-md: 12px;
            --radius-xl: 24px;
            --radius-full: 9999px;
            --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
            
            --font-family-base: 'Plus Jakarta Sans', sans-serif;
            
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ---------------------------------------------------------------------
           2. CSS RESET & NORMALIZE
           --------------------------------------------------------------------- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family-base); outline: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

        /* ---------------------------------------------------------------------
           3. HEADER & NAVIGATION
           --------------------------------------------------------------------- */
        .app-header {
            padding: 15px 5%; background-color: rgba(18, 18, 23, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }

        .header-brand { font-size: 22px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .header-brand i { color: var(--color-warning); text-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
        .version-badge { font-size: 11px; padding: 2px 8px; background: rgba(245, 158, 11, 0.15); color: var(--color-warning); border-radius: 10px; margin-left: 5px; font-weight: 800; }

        /* ---------------------------------------------------------------------
           4. COMPONENT: BUTTONS
           --------------------------------------------------------------------- */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 20px; border-radius: var(--radius-md); font-weight: 700; font-size: 14px;
            cursor: pointer; transition: var(--transition-fast); border: 1px solid transparent; text-decoration: none; white-space: nowrap;
        }
        .btn:active:not(:disabled) { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        .btn-outline { background: transparent; border-color: var(--border-strong); color: var(--text-main); }
        .btn-outline:hover:not(:disabled) { background: var(--bg-elevated); }
        .btn-warning { background: var(--color-warning); color: #fff; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .btn-warning:hover:not(:disabled) { background: #d97706; box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5); }
        .btn-primary { background: var(--brand-primary); color: #fff; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); }

        /* ---------------------------------------------------------------------
           5. WHEEL SYSTEM LAYOUT
           --------------------------------------------------------------------- */
        .wheel-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; position: relative; }
        
        .title-box { text-align: center; margin-bottom: 30px; }
        .title-box h1 { font-size: 36px; font-weight: 800; color: var(--color-warning); text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 20px rgba(245, 158, 11, 0.3); margin-bottom: 5px; }
        .title-box p { color: var(--text-muted); font-size: 15px; }
        
        .spin-counter {
            display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; padding: 10px 24px;
            background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: var(--radius-full); color: var(--color-warning); font-weight: 800; font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: var(--transition-fast);
        }
        .spin-counter.glow { animation: pulseWarning 1.5s infinite; }

        .wheel-container {
            position: relative; width: 380px; height: 380px; margin: 0 auto; border-radius: 50%; padding: 12px;
            background: linear-gradient(135deg, #1e1e26, #09090b); box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.05);
            border: 2px solid var(--border-strong);
        }

        .wheel-pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 44px; height: 54px; z-index: 10;
            background: var(--text-main); clip-path: polygon(50% 100%, 0 0, 100% 0); filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
        }

        canvas {
            width: 100%; height: 100%; border-radius: 50%; transition: transform 5s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 0 20px rgba(0,0,0,0.5); display: block;
        }

        .btn-spin {
            margin-top: 40px; padding: 20px 60px; border-radius: var(--radius-full); font-size: 18px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px; background: linear-gradient(45deg, var(--color-warning), #d97706);
            color: #fff; border: none; cursor: pointer; box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4); transition: var(--transition-normal);
        }
        .btn-spin:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(245, 158, 11, 0.6); }
        .btn-spin:active:not(:disabled) { transform: translateY(2px); }
        .btn-spin:disabled { background: var(--bg-elevated); color: var(--text-muted); box-shadow: none; cursor: not-allowed; border: 1px solid var(--border-strong); }

        /* ---------------------------------------------------------------------
           6. MODALS, OVERLAYS & TOASTS
           --------------------------------------------------------------------- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; z-index: 2000; opacity: 0; transition: opacity var(--transition-fast); padding: 20px;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-box {
            background: var(--bg-surface); padding: 40px; border-radius: var(--radius-xl); border: 1px solid var(--border-strong);
            box-shadow: var(--shadow-lg); width: 100%; max-width: 480px; transform: scale(0.95); transition: transform var(--transition-fast); position: relative; display: flex; flex-direction: column;
        }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-close {
            position: absolute; top: 20px; right: 20px; width: 36px; height: 36px; border-radius: var(--radius-full); background: var(--bg-elevated);
            border: 1px solid var(--border-strong); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition-fast); font-size: 16px;
        }
        .modal-close:hover { background: var(--color-danger-bg); color: var(--color-danger); border-color: var(--color-danger); transform: rotate(90deg); }

        /* History List inside Modal */
        .history-list { max-height: 400px; overflow-y: auto; margin-top: 20px; padding-right: 5px; }
        .history-item {
            display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border-strong);
            background: var(--bg-elevated); border-radius: var(--radius-md); margin-bottom: 12px; transition: var(--transition-fast);
        }
        .history-item:hover { background: var(--bg-body); border-color: var(--brand-primary); }
        .history-prize { font-weight: 800; color: var(--text-main); font-size: 16px; }
        .history-prize.gold { color: var(--color-warning); }
        .history-time { font-size: 12px; color: var(--text-muted); margin-top: 4px; display: block; }

        /* Toast */
        #toast-container { position: fixed; top: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 12px; }
        .toast {
            min-width: 320px; background: var(--bg-surface); border: 1px solid var(--border-strong); padding: 16px 20px; border-radius: var(--radius-md);
            display: flex; align-items: center; gap: 16px; transform: translateX(120%); transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); box-shadow: var(--shadow-lg);
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 4px solid var(--color-success); color: var(--color-success); }
        .toast.error { border-left: 4px solid var(--color-danger); color: var(--color-danger); }
        .toast.warning { border-left: 4px solid var(--color-warning); color: var(--color-warning); }

        /* Animations */
        @keyframes pulseWarning { 0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(245, 158, 11, 0); } 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); } }

        /* Responsive Breakpoints */
        @media (max-width: 480px) { .wheel-container { width: 320px; height: 320px; } .title-box h1 { font-size: 26px; } .btn-spin { padding: 16px 40px; font-size: 16px; } }
        .hidden-mobile { display: inline-block; } @media (max-width: 768px) { .hidden-mobile { display: none; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <header class="app-header">
        <div class="header-brand">
            <i class="fa-solid fa-dharmachakra"></i> QD QUAY THƯỞNG 
            <span class="version-badge">v1.5</span>
        </div>
        <div class="flex gap-3">
            <button class="btn btn-outline" onclick="History.openModal()">
                <i class="fa-solid fa-clock-rotate-left"></i> <span class="hidden-mobile">Lịch Sử Cá Nhân</span>
            </button>
          
        </div>
    </header>

    <main class="wheel-wrapper">
        <div class="title-box">
            <h1>Thử Vận May Cùng QD</h1>
            <p>Xin chào <b class="text-primary" id="player-name">User</b>! Vòng quay phần thưởng siêu cấp.</p>
            
            <div class="spin-counter" id="spin-counter-box">
                <i class="fa-solid fa-ticket"></i> 
                <span>Lượt quay của bạn:</span> 
                <span id="spin-count-val"><i class="fa-solid fa-spinner fa-spin"></i></span>
            </div>
        </div>

        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
        </div>

        <button id="spinBtn" class="btn-spin" onclick="Wheel.startSpin()">
            <i class="fa-solid fa-play mr-2"></i> BẮT ĐẦU QUAY
        </button>
    </main>

    <div class="modal-overlay" id="modal-result">
        <div class="modal-box text-center">
            <div style="font-size: 70px; color: var(--color-warning); margin-bottom: 20px; text-shadow: 0 0 30px rgba(245, 158, 11, 0.4);">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 style="font-size: 26px; margin-bottom: 12px; color: var(--text-main);">Vòng quay kết thúc!</h2>
            <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 10px;">Phần thưởng bạn vừa nhận được là:</p>
            
            <div style="padding: 20px; background: rgba(245, 158, 11, 0.1); border-radius: var(--radius-md); border: 1px solid rgba(245, 158, 11, 0.3); margin-bottom: 30px;">
                <h3 id="prizeText" style="font-size: 26px; color: var(--color-warning); margin: 0; text-transform: uppercase; letter-spacing: 0.5px;">Tên Phần Thưởng</h3>
            </div>
            
            <button class="btn btn-warning w-full" style="padding: 16px; font-size: 16px;" onclick="Wheel.closeResultModal()">
                <i class="fa-solid fa-check mr-2"></i> XÁC NHẬN NHẬN THƯỞNG
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-history">
        <div class="modal-box" style="padding: 30px;">
            <button class="modal-close" onclick="History.closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <h2 style="font-size: 22px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-clock-rotate-left text-primary"></i> Lịch Sử Nhận Thưởng
            </h2>
            <p class="text-muted text-sm mb-4 border-b border-strong pb-4" style="border-bottom: 1px solid var(--border-strong);">
                Dữ liệu cá nhân ghi nhận trong 30 ngày gần nhất.
            </p>
            
            <div class="history-list" id="history-container">
                <div class="text-center text-muted py-8">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-primary"></i><br>
                    Đang đồng bộ dữ liệu từ máy chủ...
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        /**
         * ---------------------------------------------------------------------
         * 1. FIREBASE CONFIGURATION
         * ---------------------------------------------------------------------
         */
        const firebaseConfig = {
            apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ",
            projectId: "web-dangky-123"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        /**
         * ---------------------------------------------------------------------
         * 2. APPLICATION STATE MANAGEMENT
         * ---------------------------------------------------------------------
         */
        const State = {
            currentUser: localStorage.getItem('qd_current_username'),
            currentDocId: null,
            availableSpins: 0,
            prizes: [
                { text: "10.000 VNĐ", chance: 5 },
                { text: "Tí nữa là được rồi", chance: 25 },
                { text: "Thẻ Cào 20K", chance: 5 },
                { text: "Thêm tí nữa", chance: 25 },
                { text: "Thêm 1 Lượt", chance: 10 },
                { text: "Áo QD Elite", chance: 2 },
                { text: "20.000 VNĐ", chance: 3 },
                { text: "Tí nữa là được rồi", chance: 25 }
            ]
        };

        /**
         * ---------------------------------------------------------------------
         * 3. UTILITY HELPER FUNCTIONS
         * ---------------------------------------------------------------------
         */
        const Utils = {
            toast: (message, type = 'success') => {
                const container = document.getElementById('toast-container');
                const t = document.createElement('div');
                t.className = `toast ${type} show`;
                
                let iconStr = 'fa-circle-check';
                if(type === 'error') iconStr = 'fa-circle-xmark';
                if(type === 'warning') iconStr = 'fa-triangle-exclamation';
                
                t.innerHTML = `
                    <div style="font-size: 24px; flex-shrink: 0;"><i class="fa-solid ${iconStr}"></i></div>
                    <div style="flex-col;">
                        <span style="font-size: 14px; font-weight: 600; color: var(--text-main);">${message}</span>
                    </div>
                `;
                
                container.appendChild(t);
                setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 3000);
            }
        };

        /**
         * ---------------------------------------------------------------------
         * 4. WHEEL LOGIC & RENDERING ENGINE
         * ---------------------------------------------------------------------
         */
        const Wheel = {
            canvas: document.getElementById("wheelCanvas"),
            ctx: null,
            spinBtn: document.getElementById("spinBtn"),
            currentRotation: 0,
            isSpinning: false,

            init: function() {
                this.ctx = this.canvas.getContext("2d");
                this.drawGraphics();
            },

            drawGraphics: function() {
                const slices = State.prizes.length;
                const sliceAngle = (2 * Math.PI) / slices;
                const centerX = this.canvas.width / 2;
                const centerY = this.canvas.height / 2;
                const radius = centerX;

                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = 0; i < slices; i++) {
                    const startAngle = i * sliceAngle;
                    const endAngle = startAngle + sliceAngle;
                    const sliceColor = i % 2 === 0 ? "#1e1e26" : "#27272a";

                    // Draw Slice Background
                    this.ctx.beginPath();
                    this.ctx.moveTo(centerX, centerY);
                    this.ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                    this.ctx.fillStyle = sliceColor;
                    this.ctx.fill();
                    
                    // Draw Slice Border
                    this.ctx.strokeStyle = "#3f3f46"; 
                    this.ctx.lineWidth = 4;
                    this.ctx.stroke();

                    // Draw Text
                    this.ctx.save();
                    this.ctx.translate(centerX, centerY);
                    this.ctx.rotate(startAngle + sliceAngle / 2);
                    this.ctx.textAlign = "right";
                    
                    const prizeText = State.prizes[i].text;
                    const displayText = `${i + 1}. ${prizeText}`;
                    
                    if(prizeText.includes("VNĐ") || prizeText.includes("20K")) {
                        this.ctx.fillStyle = "#f59e0b"; 
                    } else {
                        this.ctx.fillStyle = "#ffffff";
                    }
                    
                    this.ctx.font = "bold 22px 'Plus Jakarta Sans'";
                    this.ctx.shadowColor = "rgba(0,0,0,0.8)";
                    this.ctx.shadowBlur = 6;
                    this.ctx.fillText(displayText, radius - 35, 8);
                    this.ctx.restore();
                }
                
                // Draw Center Hub
                this.ctx.beginPath();
                this.ctx.arc(centerX, centerY, 35, 0, 2 * Math.PI);
                this.ctx.fillStyle = "#4f46e5";
                this.ctx.fill();
                this.ctx.strokeStyle = "#121217";
                this.ctx.lineWidth = 6;
                this.ctx.stroke();
                
                this.ctx.fillStyle = "#ffffff";
                this.ctx.font = "900 30px 'Font Awesome 6 Free'";
                this.ctx.textAlign = "center";
                this.ctx.textBaseline = "middle";
                this.ctx.fillText("\uf005", centerX, centerY);
            },

            startSpin: function() {
                if (this.isSpinning) return;
                
                if (State.availableSpins <= 0) {
                    Utils.toast("Từ chối: Bạn đã hết lượt quay! Hãy điểm danh ngày hôm nay để nhận thêm.", "warning");
                    return;
                }

                this.isSpinning = true;
                this.spinBtn.disabled = true;
                this.spinBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> ĐANG TÍNH TOÁN...`;

                db.collection("accounts").doc(State.currentDocId).update({
                    spins: firebase.firestore.FieldValue.increment(-1)
                }).then(() => {
                    
                    let totalChance = 0;
                    State.prizes.forEach(p => totalChance += (parseFloat(p.chance) || 0));

                    let winningIndex = 0;

                    if (totalChance <= 0) {
                        winningIndex = Math.floor(Math.random() * State.prizes.length);
                    } else {
                        const rand = Math.random() * totalChance;
                        let sum = 0;
                        for(let i = 0; i < State.prizes.length; i++) {
                            sum += parseFloat(State.prizes[i].chance) || 0;
                            if(rand <= sum) {
                                winningIndex = i;
                                break;
                            }
                        }
                    }
                    
                    const slices = State.prizes.length;
                    const sliceDeg = 360 / slices;
                    const targetSectorCenter = (winningIndex * sliceDeg) + (sliceDeg / 2);
                    
                    let finalDeg = 270 - targetSectorCenter;
                    if(finalDeg < 0) finalDeg += 360;

                    const spinsCount = Math.floor(Math.random() * 5) + 5;
                    const maxOffset = (sliceDeg / 2) - 4; 
                    const randomOffset = (Math.random() * (maxOffset * 2)) - maxOffset;

                    let currentMod = this.currentRotation % 360;
                    let rotateAmount = finalDeg - currentMod;
                    if (rotateAmount < 0) rotateAmount += 360; 
                    
                    rotateAmount += (360 * spinsCount) + randomOffset;
                    this.currentRotation += rotateAmount;

                    this.canvas.style.transform = `rotate(${this.currentRotation}deg)`;

                    setTimeout(() => {
                        this.isSpinning = false;
                        this.spinBtn.disabled = false;
                        this.spinBtn.innerHTML = `<i class="fa-solid fa-play mr-2"></i> BẮT ĐẦU QUAY`;

                        this.processResult(winningIndex);
                    }, 5000);

                }).catch(err => {
                    Utils.toast("Lỗi xác thực dữ liệu lượt quay với máy chủ. Vui lòng thử lại sau.", "error");
                    this.isSpinning = false; this.spinBtn.disabled = false;
                    this.spinBtn.innerHTML = `<i class="fa-solid fa-play mr-2"></i> BẮT ĐẦU QUAY`;
                });
            },

            processResult: function(winIndex) {
                const resultText = `[Ô ${winIndex + 1}] ${State.prizes[winIndex].text}`;

                document.getElementById('prizeText').innerText = resultText;
                const modal = document.getElementById('modal-result');
                modal.style.display = 'flex'; 
                void modal.offsetWidth; 
                modal.classList.add('active');

                db.collection("spin_history").add({
                    userId: State.currentUser,
                    result: resultText,
                    timestamp: Date.now()
                }).catch(err => console.error("Lỗi lưu lịch sử lên Database:", err));
            },

            closeResultModal: function() {
                const modal = document.getElementById('modal-result');
                modal.classList.remove('active'); 
                setTimeout(() => modal.style.display = 'none', 300);
            }
        };

        /**
         * ---------------------------------------------------------------------
         * 5. HISTORY MODULE
         * ---------------------------------------------------------------------
         */
        const History = {
            openModal: () => {
                const modal = document.getElementById('modal-history');
                modal.style.display = 'flex'; void modal.offsetWidth; modal.classList.add('active');
                History.fetchAndRenderData();
            },
            
            closeModal: () => {
                const modal = document.getElementById('modal-history');
                modal.classList.remove('active'); setTimeout(() => modal.style.display = 'none', 300);
            },
            
            fetchAndRenderData: () => {
                const container = document.getElementById('history-container');
                container.innerHTML = `
                    <div class="text-center text-muted py-8">
                        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-primary"></i><br>
                        Đang đồng bộ dữ liệu từ máy chủ...
                    </div>
                `;

                if(!State.currentUser) return;

                db.collection("spin_history")
                    .where("userId", "==", State.currentUser)
                    .get()
                    .then(snapshot => {
                        if (snapshot.empty) {
                            container.innerHTML = `
                                <div class="text-center text-muted py-8">
                                    <i class="fa-solid fa-box-open text-4xl mb-3 opacity-50"></i><br>
                                    Tài khoản của bạn chưa có lịch sử quay nào.
                                </div>
                            `;
                            return;
                        }

                        let records = [];
                        const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);

                        snapshot.forEach(doc => {
                            const data = doc.data();
                            if (data.timestamp >= thirtyDaysAgo) {
                                records.push(data);
                            }
                        });

                        records.sort((a, b) => b.timestamp - a.timestamp);

                        if (records.length === 0) {
                            container.innerHTML = `<div class="text-center text-muted py-8">Không có lượt quay nào được ghi nhận trong 30 ngày qua.</div>`;
                            return;
                        }

                        container.innerHTML = "";
                        
                        records.forEach(item => {
                            const dateObj = new Date(item.timestamp);
                            const dateStr = `${dateObj.getHours().toString().padStart(2,'0')}:${dateObj.getMinutes().toString().padStart(2,'0')} - ${dateObj.toLocaleDateString('vi-VN')}`;
                            
                            let iconHtml = `<div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(79, 70, 229, 0.15); color: var(--brand-primary); display: flex; align-items: center; justify-content: center; font-size: 18px;"><i class="fa-solid fa-gift"></i></div>`;
                            let textClass = "";
                            
                            if(item.result.includes("Tí nữa") || item.result.includes("May Mắn")) {
                                iconHtml = `<div style="width: 40px; height: 40px; border-radius: 10px; background: var(--bg-body); color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 18px;"><i class="fa-regular fa-face-frown"></i></div>`;
                            }
                            if(item.result.includes("VNĐ") || item.result.includes("20K")) {
                                iconHtml = `<div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(16, 185, 129, 0.15); color: var(--color-success); display: flex; align-items: center; justify-content: center; font-size: 18px;"><i class="fa-solid fa-money-bill-wave"></i></div>`;
                                textClass = "gold";
                            }

                            container.innerHTML += `
                                <div class="history-item">
                                    <div class="flex items-center gap-4">
                                        ${iconHtml}
                                        <div class="flex-col">
                                            <span class="history-prize ${textClass}">${item.result}</span>
                                            <span class="history-time">${dateStr}</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });

                    }).catch(err => {
                        container.innerHTML = `
                            <div class="text-center text-danger py-8">
                                <i class="fa-solid fa-triangle-exclamation text-3xl mb-3"></i><br>
                                Lỗi kết nối. Không thể tải lịch sử.
                            </div>
                        `;
                    });
            }
        };

        /**
         * ---------------------------------------------------------------------
         * 6. APPLICATION BOOTSTRAP (CORE INIT)
         * ---------------------------------------------------------------------
         */
        const AppCore = {
            init: () => {
                
                if (!State.currentUser) {
                    alert("SECURITY ALERT: Không tìm thấy phiên đăng nhập hệ thống. Vui lòng quay lại trang chủ để xác thực bảo mật.");
                    window.location.href = "user.html";
                    return;
                }
                
                document.getElementById('player-name').innerText = State.currentUser;

                db.collection("settings").doc("wheel_config").onSnapshot(doc => {
                    if(doc.exists && doc.data().prizes) {
                        State.prizes = doc.data().prizes;
                        Wheel.drawGraphics();
                    } else {
                        Wheel.drawGraphics();
                    }
                });

                db.collection("accounts").where("user", "==", State.currentUser).onSnapshot(snap => {
                    if(!snap.empty) {
                        const accountDoc = snap.docs[0];
                        State.currentDocId = accountDoc.id;
                        State.availableSpins = accountDoc.data().spins || 0;
                        
                        document.getElementById('spin-count-val').innerText = State.availableSpins;
                        
                        const counterBox = document.getElementById('spin-counter-box');
                        if(State.availableSpins > 0) {
                            counterBox.classList.add('glow');
                        } else {
                            counterBox.classList.remove('glow');
                        }
                        
                        if(!Wheel.isSpinning) {
                            const btn = document.getElementById('spinBtn');
                            if(State.availableSpins <= 0) {
                                btn.disabled = true;
                                btn.innerHTML = `<i class="fa-solid fa-ban mr-2"></i> ĐÃ HẾT LƯỢT`;
                            } else {
                                btn.disabled = false;
                                btn.innerHTML = `<i class="fa-solid fa-play mr-2"></i> BẮT ĐẦU QUAY`;
                            }
                        }
                    }
                });
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            Wheel.init();
            AppCore.init();
        });

    </script>
</body>
</html>
