<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{
    margin:0;
    font-family:Arial;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* ===== BACKGROUND MOBILE FRIENDLY ===== */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:url("anhnen.jpg") center/cover no-repeat;
    transform:scale(1.05);
    z-index:-2;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:-1;
}

/* ===== LOGIN ===== */
#loginScreen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    backdrop-filter: blur(10px);
}

.login-box{
    width:320px;
    padding:25px;
    border-radius:16px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    text-align:center;
}

.login-box input{
    width:90%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
    color:white;
}

.login-box button{
    padding:10px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:rgba(0,255,204,0.2);
    color:white;
}

/* ===== ADMIN PANEL ===== */
#adminPanel{
    display:none;
}

/* NAVBAR */
.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;
    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(15px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    box-sizing:border-box;
}

.menu{
    display:flex;
    gap:25px;
}

.navbar button{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:white;
    padding:10px 16px;
    border-radius:12px;
    cursor:pointer;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
}

.box{
    width:380px;
    padding:22px;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    text-align:center;
}

input{
    width:92%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.1);
    color:white;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,0.08);
    padding:12px;
    margin:10px 0;
    border-radius:14px;
}

.del{
    background:rgba(255,80,80,0.25);
    border:none;
    padding:6px 10px;
    border-radius:10px;
}

/* ===== MOBILE ===== */
@media (max-width:768px){
    .box{
        width:90%;
    }
    .menu{
        gap:10px;
        flex-wrap:wrap;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
    <div class="login-box">
        <h3>🔐 Admin Login</h3>
        <input id="adminUser" placeholder="Username">
        <input id="adminPass" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- ADMIN -->
<div id="adminPanel">

<div class="navbar">
    <div class="menu">
        <button onclick="openCreate()">➕ Tạo tài khoản</button>
        <button onclick="openUsers()">📋 Đăng ký</button>
        <button onclick="openAccounts()">👤 Tài khoản</button>
    </div>
</div>

<!-- CREATE -->
<div class="modal" id="createModal">
    <div class="box">
        <h3>Tạo tài khoản</h3>
        <input id="newUser" placeholder="Username">
        <input id="newPass" placeholder="Password">
        <button onclick="createAccount()">Tạo</button>
        <button onclick="closeAll()">Đóng</button>
    </div>
</div>

<!-- USERS -->
<div class="modal" id="usersModal">
    <div class="box">
        <h3>Danh sách đăng ký</h3>
        <button onclick="loadUsers()">Load</button>
        <button onclick="closeAll()">Đóng</button>
        <div id="usersList"></div>
    </div>
</div>

<!-- ACCOUNTS -->
<div class="modal" id="accountsModal">
    <div class="box">
        <h3>Tài khoản</h3>
        <button onclick="loadAccounts()">Load</button>
        <button onclick="closeAll()">Đóng</button>
        <div id="accountsList"></div>
    </div>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ",
  authDomain: "web-dangky-123.firebaseapp.com",
  projectId: "web-dangky-123",
});

const db = firebase.firestore();

/* LOGIN */
function login(){
    let u=document.getElementById("adminUser").value;
    let p=document.getElementById("adminPass").value;

    if(u==="admin" && p==="123"){
        document.getElementById("loginScreen").style.display="none";
        document.getElementById("adminPanel").style.display="block";
    }else{
        alert("Sai tài khoản admin!");
    }
}

/* MODAL */
function openCreate(){ document.getElementById("createModal").style.display="flex"; }
function openUsers(){ document.getElementById("usersModal").style.display="flex"; loadUsers(); }
function openAccounts(){ document.getElementById("accountsModal").style.display="flex"; loadAccounts(); }
function closeAll(){ document.querySelectorAll(".modal").forEach(m=>m.style.display="none"); }

/* USERS */
function loadUsers(){
    let box=document.getElementById("usersList");
    box.innerHTML="";
    db.collection("users").orderBy("time","desc").get().then(snap=>{
        snap.forEach(doc=>{
            let u=doc.data();
            box.innerHTML+=`
            <div class="item">
                <div><b>${u.name}</b><br>ID: ${u.gameId}</div>
                <button class="del" onclick="deleteUser('${doc.id}')">X</button>
            </div>`;
        });
    });
}

function deleteUser(id){
    db.collection("users").doc(id).delete().then(loadUsers);
}

/* ACCOUNTS */
function loadAccounts(){
    let box=document.getElementById("accountsList");
    box.innerHTML="";
    db.collection("accounts").orderBy("time","desc").get().then(snap=>{
        snap.forEach(doc=>{
            let a=doc.data();
            box.innerHTML+=`
            <div class="item">
                <div><b>${a.user}</b><br>${a.pass}</div>
                <button class="del" onclick="deleteAccount('${doc.id}')">X</button>
            </div>`;
        });
    });
}

function deleteAccount(id){
    db.collection("accounts").doc(id).delete().then(loadAccounts);
}

/* CREATE */
function createAccount(){
    let u=document.getElementById("newUser").value;
    let p=document.getElementById("newPass").value;

    db.collection("accounts").add({
        user:u,
        pass:p,
        role:"user",
        time:new Date()
    }).then(()=>{
        alert("Tạo thành công!");
        closeAll();
    });
}
</script>

</body>
</html>
