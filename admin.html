<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Viên - QD Mobile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #0b0f1a;
            --card: #161e2d;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #ff4d4d;
            --success: #10b981;
            --warning: #fbbf24;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --gradient: linear-gradient(135deg, #00f2fe, #4facfe);
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); line-height: 1.6; }

        /* LOGIN SCREEN */
        #loginScreen { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; background: var(--bg); z-index: 2000; }
        .login-box { width: 90%; max-width: 400px; padding: 40px; background: var(--card); border-radius: 32px; border: 1px solid var(--border); text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        /* NAVBAR */
        .navbar { 
            position: fixed; top: 0; left: 0; right: 0; height: 70px; 
            background: rgba(22, 30, 45, 0.8); backdrop-filter: blur(20px); 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 30px; z-index: 1000; border-bottom: 1px solid var(--border); 
        }
        .nav-logo { font-size: 22px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* MAIN LAYOUT */
        #adminPanel { display: none; padding: 100px 20px 40px; max-width: 1200px; margin: 0 auto; }

        /* STATS GRID */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid var(--border); position: relative; overflow: hidden; }
        .stat-card::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--gradient); }
        .stat-card h3 { margin: 0; font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .val { font-size: 38px; font-weight: 800; margin-top: 10px; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* MODALS */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1500; padding: 20px; backdrop-filter: blur(5px); }
        .modal-box { background: var(--card); width: 100%; max-width: 900px; max-height: 85vh; border-radius: 32px; padding: 35px; overflow-y: auto; border: 1px solid var(--border); box-shadow: 0 0 40px rgba(0, 242, 254, 0.1); }
        
        /* TABLES */
        .table-container { margin-top: 20px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.02); }
        th { background: rgba(255,255,255,0.05); text-align: left; padding: 16px; color: var(--secondary); font-size: 12px; text-transform: uppercase; }
        td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; }

        /* BUTTONS */
        input, textarea { 
            width: 100%; padding: 14px; margin: 10px 0; border-radius: 14px; 
            border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: white; outline: none;
        }
        .btn { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; transition: 0.3s; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
        .btn-primary { background: var(--gradient); color: #000; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: white; }
        .btn-danger { background: rgba(255, 77, 77, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-warning { background: rgba(251, 191, 36, 0.1); color: var(--warning); border: 1px solid var(--warning); }
        .btn-success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid var(--success); }

        /* BADGES */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .badge-online { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge-offline { background: rgba(148, 163, 184, 0.1); color: var(--text-dim); }
        .badge-blocked { background: rgba(255, 77, 77, 0.2); color: var(--danger); }

        .news-item-row { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h2 style="margin-bottom: 10px;">QD ADMIN</h2>
        <input id="adminUser" placeholder="Tên đăng nhập">
        <input id="adminPass" type="password" placeholder="Mật khẩu">
        <button class="btn btn-primary" style="width: 100%; margin-top: 15px; justify-content: center;" onclick="login()">ĐĂNG NHẬP</button>
    </div>
</div>

<div id="adminPanel">
    <div class="navbar">
        <div class="nav-logo">QD ADMIN</div>
        <div style="display: flex; gap: 8px;">
            <button class="btn btn-primary" onclick="openModal('newsModal')">📰 Tin tức</button>
            <button class="btn btn-outline" onclick="openModal('usersModal')">📋 Duyệt đơn</button>
            <button class="btn btn-outline" onclick="openModal('accModal')">👤 Thành viên</button>
            <button class="btn btn-danger" onclick="location.reload()">Thoát</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>Thành viên</h3><div class="val" id="s-acc">0</div></div>
        <div class="stat-card"><h3>Đơn chờ</h3><div class="val" id="s-users" style="color:var(--warning)">0</div></div>
        <div class="stat-card"><h3>Bản tin</h3><div class="val" id="s-news">0</div></div>
    </div>

    <div class="modal" id="accModal">
        <div class="modal-box">
            <h2 style="margin-top:0">👤 Quản lý thành viên</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 20px;">
                <input id="inUser" placeholder="User mới" style="margin:0">
                <input id="inPass" placeholder="Pass mới" style="margin:0">
                <button class="btn btn-primary" onclick="addAcc()">TẠO TÀI KHOẢN</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Tên tài khoản</th>
                            <th>Mật khẩu</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="listAcc"></tbody>
                </table>
            </div>
            <button class="btn btn-outline" style="width:100%; margin-top:20px" onclick="closeModal()">ĐÓNG</button>
        </div>
    </div>

    <div class="modal" id="usersModal">
        <div class="modal-box">
            <h2 style="margin-top:0">📋 Đơn đăng ký chờ</h2>
            <div class="table-container">
                <table>
                    <thead><tr><th>Tên NV</th><th>ID Game</th><th>Thao tác</th></tr></thead>
                    <tbody id="listPending"></tbody>
                </table>
            </div>
            <button class="btn btn-outline" style="width:100%; margin-top:20px" onclick="closeModal()">ĐÓNG</button>
        </div>
    </div>

    <div class="modal" id="newsModal">
        <div class="modal-box" style="max-width: 500px;">
            <h2 style="margin-top:0">📰 Đăng thông báo</h2>
            <textarea id="newsContent" rows="4" placeholder="Nội dung..."></textarea>
            <button class="btn btn-primary" style="width:100%" onclick="addNews()">ĐĂNG TIN</button>
            <div id="listNews" style="margin-top:20px"></div>
            <button class="btn btn-outline" style="width:100%; margin-top:10px" onclick="closeModal()">ĐÓNG</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = { apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ", projectId: "web-dangky-123" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function login() {
        if(document.getElementById("adminUser").value === "admin" && document.getElementById("adminPass").value === "123") {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("adminPanel").style.display = "block";
            initSystem();
        } else alert("Sai thông tin!");
    }

    function openModal(id) { document.getElementById(id).style.display = "flex"; }
    function closeModal() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }

    function initSystem() {
        // Render tài khoản & Chức năng Chặn
        db.collection("accounts").onSnapshot(snap => {
            document.getElementById("s-acc").innerText = snap.size;
            const list = document.getElementById("listAcc");
            list.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                const status = getStatus(d.lastActive);
                const isBlocked = d.isBlocked || false;
                
                list.innerHTML += `
                    <tr>
                        <td><b style="${isBlocked ? 'text-decoration: line-through; color: gray;' : ''}">${d.user}</b></td>
                        <td><code>${d.pass}</code></td>
                        <td>
                            ${isBlocked ? '<span class="badge badge-blocked">ĐÃ CHẶN</span>' : 
                            `<span class="badge ${status.class}">${status.text}</span>`}
                        </td>
                        <td>
                            <div style="display:flex; gap:5px">
                                <button class="btn ${isBlocked ? 'btn-success' : 'btn-warning'}" onclick="toggleBlock('${doc.id}', ${isBlocked})">
                                    ${isBlocked ? 'Mở' : 'Chặn'}
                                </button>
                                <button class="btn btn-danger" onclick="deleteDoc('accounts', '${doc.id}')">Xóa</button>
                            </div>
                        </td>
                    </tr>`;
            });
        });

        // Đơn đăng ký
        db.collection("users").onSnapshot(snap => {
            document.getElementById("s-users").innerText = snap.size;
            const list = document.getElementById("listPending");
            list.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `<tr><td>${d.name}</td><td>${d.gameId}</td><td><button class="btn btn-primary" onclick="deleteDoc('users', '${doc.id}')">Xong</button></td></tr>`;
            });
        });

        // Tin tức
        db.collection("news").orderBy("time", "desc").onSnapshot(snap => {
            document.getElementById("s-news").innerText = snap.size;
            const list = document.getElementById("listNews");
            list.innerHTML = "";
            snap.forEach(doc => {
                list.innerHTML += `<div class="news-item-row"><span>${doc.data().content.substring(0,30)}...</span><button class="btn btn-danger" onclick="deleteDoc('news', '${doc.id}')">Xóa</button></div>`;
            });
        });
    }

    function getStatus(ts) {
        if(!ts) return { class: 'badge-offline', text: 'Ngoại tuyến' };
        return (Date.now() - ts < 120000) ? { class: 'badge-online', text: 'Online' } : { class: 'badge-offline', text: 'Offline' };
    }

    // HÀM CHẶN TÀI KHOẢN
    function toggleBlock(id, currentStatus) {
        const action = currentStatus ? "Mở chặn" : "Chặn";
        if(confirm(`Bạn muốn ${action} tài khoản này?`)) {
            db.collection("accounts").doc(id).update({
                isBlocked: !currentStatus
            });
        }
    }

    function addAcc() {
        const u = document.getElementById("inUser").value;
        const p = document.getElementById("inPass").value;
        if(u && p) db.collection("accounts").add({ user: u, pass: p, lastActive: 0, isBlocked: false });
    }

    function addNews() {
        const c = document.getElementById("newsContent").value;
        if(c) db.collection("news").add({ content: c, time: Date.now() });
    }

    function deleteDoc(col, id) {
        if(confirm("Xác nhận xóa?")) db.collection(col).doc(id).delete();
    }
</script>
</body>
</html>
