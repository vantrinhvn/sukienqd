<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:url("anhnen.jpg") no-repeat center/cover;
    color:white;
}

/* ===== NAVBAR ===== */
.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;
    background:rgba(0,0,0,0.35);
    backdrop-filter: blur(15px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    box-sizing:border-box;
}

/* MENU CENTER */
.menu{
    display:flex;
    gap:25px;
}

/* ===== BUTTON GLASS STYLE ===== */
.navbar button{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    color:white;
    padding:10px 16px;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
    backdrop-filter: blur(10px);
    transition:0.25s;
}

.navbar button:hover{
    background:rgba(0,255,204,0.15);
    transform:translateY(-2px);
}

/* LOGOUT */
.logout{
    background:rgba(255,80,120,0.2);
    border:1px solid rgba(255,80,120,0.4);
}

/* ===== MODAL ===== */
.modal{
    display:none;
    position:fixed;
    inset:0;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
}

/* GLASS BOX */
.box{
    width:380px;
    padding:22px;
    border-radius:18px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px);
    text-align:center;
}

/* INPUT */
input{
    width:92%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.1);
    color:white;
    outline:none;
}

/* BUTTON INSIDE BOX */
.box button{
    padding:10px 14px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    margin:6px;
    background:rgba(255,255,255,0.12);
    color:white;
    transition:0.2s;
}

.box button:hover{
    background:rgba(0,255,204,0.25);
}

/* LIST ITEM */
.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,0.08);
    padding:12px;
    margin:10px 0;
    border-radius:14px;
}

/* DELETE BUTTON */
.del{
    background:rgba(255,80,80,0.25);
    border:1px solid rgba(255,80,80,0.4);
    padding:6px 10px;
    border-radius:10px;
}

/* EYE BUTTON */
.eye{
    background:rgba(0,255,204,0.15);
    border:1px solid rgba(0,255,204,0.3);
    padding:6px 10px;
    border-radius:10px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="menu">
        <button onclick="openCreate()">➕ Tạo tài khoản</button>
        <button onclick="openUsers()">📋 Đăng ký</button>
        <button onclick="openAccounts()">👤 Tài khoản</button>
    </div>

    <button class="logout" onclick="logout()">Logout</button>
</div>

<!-- CREATE -->
<div class="modal" id="createModal">
    <div class="box">
        <h3>Tạo tài khoản</h3>
        <input id="newUser" placeholder="Username">
        <input id="newPass" placeholder="Password">
        <button onclick="createAccount()">Tạo</button>
        <button onclick="closeAll()">Đóng</button>
    </div>
</div>

<!-- USERS -->
<div class="modal" id="usersModal">
    <div class="box">
        <h3>Danh sách đăng ký</h3>
        <button onclick="loadUsers()">Load</button>
        <button onclick="closeAll()">Đóng</button>
        <div id="usersList"></div>
    </div>
</div>

<!-- ACCOUNTS -->
<div class="modal" id="accountsModal">
    <div class="box">
        <h3>Tài khoản</h3>
        <button onclick="loadAccounts()">Load</button>
        <button onclick="closeAll()">Đóng</button>
        <div id="accountsList"></div>
    </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ",
  authDomain: "web-dangky-123.firebaseapp.com",
  projectId: "web-dangky-123",
});

const db = firebase.firestore();

/* MODAL */
function openCreate(){ document.getElementById("createModal").style.display="flex"; }
function openUsers(){ document.getElementById("usersModal").style.display="flex"; loadUsers(); }
function openAccounts(){ document.getElementById("accountsModal").style.display="flex"; loadAccounts(); }
function closeAll(){ document.querySelectorAll(".modal").forEach(m=>m.style.display="none"); }

/* USERS */
function loadUsers(){
    let box=document.getElementById("usersList");
    box.innerHTML="";

    db.collection("users").orderBy("time","desc").get()
    .then(snap=>{
        snap.forEach(doc=>{
            let u=doc.data();

            box.innerHTML+=`
            <div class="item">
                <div>
                    <b>${u.name}</b><br>
                    ID: ${u.gameId}
                </div>
                <button class="del" onclick="deleteUser('${doc.id}')">X</button>
            </div>`;
        });
    });
}

function deleteUser(id){
    db.collection("users").doc(id).delete().then(loadUsers);
}

/* ACCOUNTS */
function loadAccounts(){
    let box=document.getElementById("accountsList");
    box.innerHTML="";

    db.collection("accounts").orderBy("time","desc").get()
    .then(snap=>{
        snap.forEach(doc=>{
            let a=doc.data();

            box.innerHTML+=`
            <div class="item">
                <div>
                    <b>${a.user}</b><br>
                    <span id="pw-${doc.id}" data-pw="${a.pass}">••••••••</span><br>
                    <small>${a.role}</small>
                </div>

                <div>
                    <button class="eye" onclick="togglePass('${doc.id}')">👁</button>
                    <button class="del" onclick="deleteAccount('${doc.id}')">X</button>
                </div>
            </div>`;
        });
    });
}

function togglePass(id){
    let el=document.getElementById("pw-"+id);

    if(el.innerText==="••••••••"){
        el.innerText=el.getAttribute("data-pw");
    }else{
        el.innerText="••••••••";
    }
}

function deleteAccount(id){
    db.collection("accounts").doc(id).delete().then(loadAccounts);
}

/* CREATE */
function createAccount(){
    let u=document.getElementById("newUser").value;
    let p=document.getElementById("newPass").value;

    if(!u||!p){
        alert("Nhập đủ!");
        return;
    }

    db.collection("accounts").add({
        user:u,
        pass:p,
        role:"user",
        time:new Date()
    }).then(()=>{
        alert("Tạo thành công!");
        closeAll();
    });
}

/* LOGOUT */
function logout(){
    window.location.href="index.html";
}
</script>

</body>
</html>
