<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Pro</title>

    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg-glass: rgba(255, 255, 255, 0.1);
            --border-glass: rgba(255, 255, 255, 0.2);
            --danger: #ff4d4d;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            background: #0f172a; /* Màu nền dự phòng */
        }

        /* ===== BACKGROUND ===== */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url("anhnen.jpg") center/cover no-repeat;
            transform: scale(1.1);
            z-index: -2;
            filter: brightness(0.6);
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(79, 172, 254, 0.2), transparent);
            z-index: -1;
        }

        /* ===== LOGIN SCREEN ===== */
        #loginScreen {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
            z-index: 1000;
        }

        .login-box {
            width: 350px;
            padding: 40px;
            border-radius: 24px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-box h3 { margin-bottom: 30px; font-size: 24px; letter-spacing: 1px; }

        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); background: rgba(0, 0, 0, 0.4); }

        button {
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000;
            margin-top: 10px;
        }

        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3); }

        /* ===== ADMIN PANEL ===== */
        #adminPanel { display: none; padding-top: 100px; }

        .navbar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            height: 70px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
            z-index: 99;
        }

        .menu { display: flex; gap: 15px; }

        .navbar button {
            background: transparent;
            border: 1px solid transparent;
            color: rgba(255,255,255,0.7);
            padding: 10px 20px;
            border-radius: 12px;
        }

        .navbar button:hover {
            background: var(--bg-glass);
            color: white;
            border-color: var(--border-glass);
        }

        /* ===== MODALS & LISTS ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .box {
            width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 24px;
            background: #1e293b;
            border: 1px solid var(--border-glass);
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            margin: 12px 0;
            border-radius: 16px;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .item:hover { border-color: var(--secondary); background: rgba(255, 255, 255, 0.08); }

        .item b { color: var(--primary); font-size: 1.1em; }

        .del {
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: var(--danger);
            padding: 8px 12px;
            border-radius: 10px;
        }

        .del:hover { background: var(--danger); color: white; }

        .close-btn { background: #334155; color: white; border: none; padding: 10px 20px; border-radius: 10px; margin-top: 15px; width: 100%; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: 10px; }

        @media (max-width: 768px) {
            .box { width: 90%; }
            .navbar { height: auto; padding: 10px; top: 10px; }
            .menu { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>

<body>

<div id="loginScreen">
    <div class="login-box">
        <h3>🔐 Admin Access</h3>
        <input id="adminUser" placeholder="Tên đăng nhập">
        <input id="adminPass" type="password" placeholder="Mật khẩu">
        <button class="btn-main" onclick="login()">Đăng Nhập</button>
    </div>
</div>

<div id="adminPanel">
    <div class="navbar">
        <div class="menu">
            <button onclick="openCreate()">➕ Tạo mới</button>
            <button onclick="openUsers()">📋 Đăng ký</button>
            <button onclick="openAccounts()">👤 Tài khoản</button>
        </div>
    </div>

    <div class="modal" id="createModal">
        <div class="box">
            <h3 style="color: var(--primary)">Tạo tài khoản mới</h3>
            <input id="newUser" placeholder="Username">
            <input id="newPass" placeholder="Password">
            <button class="btn-main" onclick="createAccount()">Xác nhận tạo</button>
            <button class="close-btn" onclick="closeAll()">Hủy bỏ</button>
        </div>
    </div>

    <div class="modal" id="usersModal">
        <div class="box">
            <h3 style="color: var(--primary)">Danh sách đăng ký</h3>
            <div id="usersList"></div>
            <button class="close-btn" onclick="closeAll()">Đóng</button>
        </div>
    </div>

    <div class="modal" id="accountsModal">
        <div class="box">
            <h3 style="color: var(--primary)">Quản lý tài khoản</h3>
            <div id="accountsList"></div>
            <button class="close-btn" onclick="closeAll()">Đóng</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
    firebase.initializeApp({
        apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ",
        authDomain: "web-dangky-123.firebaseapp.com",
        projectId: "web-dangky-123",
    });

    const db = firebase.firestore();

    function login() {
        let u = document.getElementById("adminUser").value;
        let p = document.getElementById("adminPass").value;
        if (u === "admin" && p === "123") {
            document.getElementById("loginScreen").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
            }, 300);
        } else {
            alert("Sai tài khoản hoặc mật khẩu!");
        }
    }

    function openCreate() { closeAll(); document.getElementById("createModal").style.display = "flex"; }
    function openUsers() { closeAll(); document.getElementById("usersModal").style.display = "flex"; loadUsers(); }
    function openAccounts() { closeAll(); document.getElementById("accountsModal").style.display = "flex"; loadAccounts(); }
    function closeAll() { document.querySelectorAll(".modal").forEach(m => m.style.display = "none"); }

    function loadUsers() {
        let box = document.getElementById("usersList");
        box.innerHTML = "<p>Đang tải...</p>";
        db.collection("users").orderBy("time", "desc").get().then(snap => {
            box.innerHTML = "";
            snap.forEach(doc => {
                let u = doc.data();
                box.innerHTML += `
                <div class="item">
                    <div><b>${u.name}</b><br><small style="color:rgba(255,255,255,0.5)">ID: ${u.gameId}</small></div>
                    <button class="del" onclick="deleteUser('${doc.id}')">Xóa</button>
                </div>`;
            });
        });
    }

    function deleteUser(id) {
        if(confirm("Xác nhận xóa người dùng này?")) {
            db.collection("users").doc(id).delete().then(loadUsers);
        }
    }

    function loadAccounts() {
        let box = document.getElementById("accountsList");
        box.innerHTML = "<p>Đang tải...</p>";
        db.collection("accounts").orderBy("time", "desc").get().then(snap => {
            box.innerHTML = "";
            snap.forEach(doc => {
                let a = doc.data();
                box.innerHTML += `
                <div class="item">
                    <div><b>${a.user}</b><br><small style="color:rgba(255,255,255,0.5)">PW: ${a.pass}</small></div>
                    <button class="del" onclick="deleteAccount('${doc.id}')">Xóa</button>
                </div>`;
            });
        });
    }

    function deleteAccount(id) {
        if(confirm("Xác nhận xóa tài khoản này?")) {
            db.collection("accounts").doc(id).delete().then(loadAccounts);
        }
    }

    function createAccount() {
        let u = document.getElementById("newUser").value;
        let p = document.getElementById("newPass").value;
        if(!u || !p) return alert("Vui lòng nhập đủ thông tin!");

        db.collection("accounts").add({
            user: u,
            pass: p,
            role: "user",
            time: new Date()
        }).then(() => {
            alert("Đã tạo tài khoản thành công!");
            document.getElementById("newUser").value = "";
            document.getElementById("newPass").value = "";
            closeAll();
        });
    }
</script>

</body>
</html>
