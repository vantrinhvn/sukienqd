<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard Pro - Military Grade</title>

    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #f093fb;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --danger: #ff4d4d;
            --success: #00e676;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== BACKGROUND DYNAMIC ===== */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url("anhnen.jpg") center/cover no-repeat;
            filter: brightness(0.3) blur(5px);
            z-index: -2;
            transform: scale(1.1);
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(0, 242, 254, 0.1), transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(240, 147, 251, 0.1), transparent 40%);
            z-index: -1;
        }

        /* ===== LOGIN SCREEN ===== */
        #loginScreen {
            position: fixed; inset: 0;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(20px); z-index: 1000;
            transition: 0.5s ease;
        }

        .login-box {
            width: 380px; padding: 45px; border-radius: 32px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.7);
            text-align: center;
        }

        .login-box h2 { font-size: 28px; margin-bottom: 30px; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        input {
            width: 100%; padding: 15px; margin: 12px 0;
            border-radius: 16px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.05); color: white;
            outline: none; transition: 0.3s; box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); box-shadow: 0 0 15px rgba(0,242,254,0.2); }

        .btn-main {
            width: 100%; padding: 15px; border: none; border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #000; font-weight: 800; cursor: pointer; margin-top: 15px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,242,254,0.4); }

        /* ===== DASHBOARD PANEL ===== */
        #adminPanel { display: none; padding: 120px 20px 50px; }

        .navbar {
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 900px; height: 75px;
            background: rgba(255,255,255,0.03); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 24px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 25px; z-index: 999; box-sizing: border-box;
        }

        .nav-logo { font-weight: 900; font-size: 20px; color: var(--primary); letter-spacing: 2px; }

        .menu { display: flex; gap: 10px; }
        .menu button {
            background: transparent; border: 1px solid transparent; color: #94a3b8;
            padding: 10px 18px; border-radius: 14px; cursor: pointer; transition: 0.3s;
            font-weight: 600;
        }
        .menu button:hover { background: rgba(255,255,255,0.05); color: white; border-color: var(--border); }

        /* Stats Bar */
        .stats-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; max-width: 1000px; margin: 0 auto 40px;
        }
        .stat-card {
            background: var(--glass); padding: 25px; border-radius: 24px;
            border: 1px solid var(--border); text-align: center;
        }
        .stat-card h4 { margin: 0; color: #94a3b8; font-size: 14px; text-transform: uppercase; }
        .stat-card div { font-size: 32px; font-weight: 800; margin-top: 10px; color: var(--primary); }

        /* ===== MODALS ===== */
        .modal {
            display: none; position: fixed; inset: 0;
            justify-content: center; align-items: center;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 1000;
        }

        .box {
            width: 480px; max-height: 85vh; padding: 35px; border-radius: 30px;
            background: #1e293b; border: 1px solid var(--border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); overflow-y: auto;
        }

        .item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); padding: 18px 22px;
            margin: 14px 0; border-radius: 20px; border: 1px solid transparent;
            transition: 0.3s;
        }
        .item:hover { background: rgba(255,255,255,0.06); border-color: var(--secondary); transform: translateX(5px); }

        .item b { font-size: 17px; display: block; margin-bottom: 4px; }
        .item small { color: #64748b; font-weight: 500; }

        .del {
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--danger); padding: 10px 15px; border-radius: 12px;
            cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .del:hover { background: var(--danger); color: white; }

        .close-btn { background: #334155; color: white; border: none; padding: 15px; border-radius: 16px; width: 100%; margin-top: 20px; cursor: pointer; font-weight: bold; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 10px; }
    </style>
</head>

<body>
<div class="bg-glow"></div>

<div id="loginScreen">
    <div class="login-box">
        <h2>CENTRAL ADMIN</h2>
        <input id="adminUser" placeholder="Admin ID">
        <input id="adminPass" type="password" placeholder="Passcode">
        <button class="btn-main" onclick="login()">BẮT ĐẦU TRUY CẬP</button>
    </div>
</div>

<div id="adminPanel">
    <div class="navbar">
        <div class="nav-logo">QD PANEL</div>
        <div class="menu">
            <button onclick="openCreate()">➕ TẠO ACC</button>
            <button onclick="openUsers()">📋 ĐĂNG KÝ</button>
            <button onclick="openAccounts()">👤 QUẢN LÝ</button>
        </div>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <h4>Thành viên đăng ký</h4>
            <div id="countUsers">0</div>
        </div>
        <div class="stat-card">
            <h4>Tài khoản hệ thống</h4>
            <div id="countAccounts">0</div>
        </div>
    </div>

    <div class="modal" id="createModal">
        <div class="box">
            <h3 style="color: var(--primary); margin-top:0">🔑 CẤP TÀI KHOẢN MỚI</h3>
            <input id="newUser" placeholder="Tên tài khoản (User)">
            <input id="newPass" placeholder="Mật khẩu (Pass)">
            <button class="btn-main" onclick="createAccount()">XÁC NHẬN CẤP PHÉP</button>
            <button class="close-btn" onclick="closeAll()">HỦY BỎ</button>
        </div>
    </div>

    <div class="modal" id="usersModal">
        <div class="box">
            <h3 style="color: var(--primary); margin-top:0">📋 ĐƠN ĐĂNG KÝ</h3>
            <div id="usersList"></div>
            <button class="close-btn" onclick="closeAll()">ĐÓNG DANH SÁCH</button>
        </div>
    </div>

    <div class="modal" id="accountsModal">
        <div class="box">
            <h3 style="color: var(--secondary); margin-top:0">👤 DANH SÁCH TÀI KHOẢN</h3>
            <div id="accountsList"></div>
            <button class="close-btn" onclick="closeAll()">ĐÓNG QUẢN LÝ</button>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
    firebase.initializeApp({
        apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ",
        authDomain: "web-dangky-123.firebaseapp.com",
        projectId: "web-dangky-123",
    });
    const db = firebase.firestore();

    function login() {
        let u = document.getElementById("adminUser").value;
        let p = document.getElementById("adminPass").value;
        if (u === "admin" && p === "123") {
            document.getElementById("loginScreen").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                updateStats();
            }, 500);
        } else {
            alert("⚠️ Truy cập bị từ chối!");
        }
    }

    function openCreate() { closeAll(); document.getElementById("createModal").style.display = "flex"; }
    function openUsers() { closeAll(); document.getElementById("usersModal").style.display = "flex"; loadUsers(); }
    function openAccounts() { closeAll(); document.getElementById("accountsModal").style.display = "flex"; loadAccounts(); }
    function closeAll() { document.querySelectorAll(".modal").forEach(m => m.style.display = "none"); }

    function updateStats() {
        db.collection("users").get().then(s => document.getElementById("countUsers").innerText = s.size);
        db.collection("accounts").get().then(s => document.getElementById("countAccounts").innerText = s.size);
    }

    function loadUsers() {
        let box = document.getElementById("usersList");
        box.innerHTML = "<p style='text-align:center'>📡 Đang quét dữ liệu...</p>";
        db.collection("users").orderBy("time", "desc").onSnapshot(snap => {
            box.innerHTML = snap.empty ? "<p style='text-align:center; color:#64748b'>Trống</p>" : "";
            snap.forEach(doc => {
                let u = doc.data();
                box.innerHTML += `
                <div class="item">
                    <div><b>${u.name}</b><small>Game ID: ${u.gameId}</small></div>
                    <button class="del" onclick="deleteDoc('users', '${doc.id}')">XÓA</button>
                </div>`;
            });
            updateStats();
        });
    }

    function loadAccounts() {
        let box = document.getElementById("accountsList");
        box.innerHTML = "<p style='text-align:center'>📡 Đang quét dữ liệu...</p>";
        db.collection("accounts").orderBy("time", "desc").onSnapshot(snap => {
            box.innerHTML = snap.empty ? "<p style='text-align:center; color:#64748b'>Chưa có tài khoản</p>" : "";
            snap.forEach(doc => {
                let a = doc.data();
                box.innerHTML += `
                <div class="item">
                    <div><b>${a.user}</b><small>Pass: ${a.pass}</small></div>
                    <button class="del" onclick="deleteDoc('accounts', '${doc.id}')">XÓA</button>
                </div>`;
            });
            updateStats();
        });
    }

    function deleteDoc(col, id) {
        if(confirm("❗ Bạn chắc chắn muốn xóa dữ liệu này?")) {
            db.collection(col).doc(id).delete();
        }
    }

    function createAccount() {
        let u = document.getElementById("newUser").value.trim();
        let p = document.getElementById("newPass").value.trim();
        if(!u || !p) return alert("❌ Thiếu thông tin!");

        db.collection("accounts").add({
            user: u, pass: p, role: "user", time: new Date()
        }).then(() => {
            alert("✅ Tài khoản đã được kích hoạt!");
            document.getElementById("newUser").value = "";
            document.getElementById("newPass").value = "";
            closeAll();
        });
    }
</script>
</body>
</html>
