<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#b91c1c">
    <title>Quân Sư AI - Trợ Lý Quân Đoàn</title>
    <link rel="icon" href="logo.jpg">
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>try{var _tc=localStorage.getItem("qd_tet_color");if(_tc==="dao"||_tc==="chung")document.documentElement.setAttribute("data-tet-color",_tc);if(window.top!==window||/[?&]embed=1/.test(location.search))document.documentElement.classList.add("embed");}catch(e){document.documentElement.classList.add("embed");}</script>
    <style>
        /* =====================================================================
           QUÂN SƯ AI - trợ lý giải thích cơ chế hệ thống Quân Đoàn (QĐ TLH)
           Màu theo chủ đề Tết đã chọn ở trang user: Đỏ Lì Xì / Hoa Đào / Bánh Chưng
           ===================================================================== */
        :root {
            --lq1: #d42330; --lq2: #8f0a12; --lq3: #6a0008; --ink: #9b0d19;
            --gold: #ffd54a; --gold-2: #f2b705; --gold-line: rgba(214, 158, 30, .5);
            --paper: rgba(255, 249, 232, .94); --paper-solid: #fff8e6; --cream: #fffdf6;
            --text: #3b1a00; --muted: #8a5a2b; --ok: #15803d; --bad: #c81e1e;
            --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --r: 18px;
        }
        html[data-tet-color="dao"] { --lq1: #d93a72; --lq2: #8e1442; --lq3: #650c30; --ink: #9d1748; }
        html[data-tet-color="chung"] { --lq1: #14965b; --lq2: #06553a; --lq3: #033d29; --ink: #0b6b40; }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; overflow: hidden;
            background: #fff0cf url('nen-tet-ngang.jpg') center top / cover no-repeat;
        }
        @media (orientation: portrait) { body { background-image: url('nen-tet-doc.jpg'); } }
        html.embed body { background: var(--paper-solid); }
        button, input, textarea { font: inherit; color: inherit; }
        button { border: none; background: none; cursor: pointer; }
        a { color: inherit; }

        /* ---------- Khung ứng dụng ---------- */
        .app {
            position: fixed; inset: 0; display: flex; flex-direction: column; margin: 0 auto; max-width: 780px;
            background: var(--paper); border-left: 1.5px solid var(--gold-line); border-right: 1.5px solid var(--gold-line);
            box-shadow: 0 0 60px -20px rgba(120, 40, 0, .45);
        }
        @media (min-width: 820px) and (min-height: 640px) {
            .app { inset: 24px 0; border-radius: 26px; border: 1.5px solid var(--gold-line); overflow: hidden; }
        }
        html.embed .app { max-width: none; border: none; box-shadow: none; border-radius: 0; inset: 0; background: var(--paper-solid); }

        /* ---------- Thanh trên ---------- */
        .top {
            flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
            padding: max(10px, env(safe-area-inset-top)) 12px 10px;
            background: linear-gradient(160deg, var(--lq1), var(--lq2)); color: #fff; border-bottom: 2px solid var(--gold-2);
            position: relative; z-index: 3;
        }
        html.embed .top { padding-top: 10px; }
        .ic-btn {
            flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--gold); background: rgba(0, 0, 0, .18); border: 1.5px solid rgba(255, 213, 74, .65); text-decoration: none;
        }
        .ic-btn:active { transform: scale(.92); }
        .ic-btn svg { width: 20px; height: 20px; }
        .ic-btn[hidden] { display: none; }
        .avatar { flex: 0 0 auto; position: relative; width: 44px; height: 44px; }
        .avatar img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); background: #2a0000; display: block; }
        .avatar .badge {
            position: absolute; right: -4px; bottom: -3px; padding: 1px 5px; border-radius: 999px; font-size: 9.5px; font-weight: 800; letter-spacing: .4px;
            color: var(--lq3); background: linear-gradient(135deg, #fff6c8, var(--gold) 55%, var(--gold-2)); border: 1.5px solid #fff;
        }
        .ttl { flex: 1 1 auto; min-width: 0; line-height: 1.2; }
        .ttl b { display: block; font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .ttl small { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #fde68a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
        .dot.on { background: #4ade80; box-shadow: 0 0 0 3px rgba(74, 222, 128, .25); }

        /* ---------- Túi đồ (khi đã đăng nhập) ---------- */
        .wallet {
            flex: 0 0 auto; display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; scrollbar-width: none;
            background: var(--cream); border-bottom: 1px solid var(--gold-line);
        }
        .wallet::-webkit-scrollbar { display: none; }
        .wallet[hidden] { display: none; }
        .wchip {
            flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px;
            font-size: 12.5px; font-weight: 700; color: var(--ink); background: #fff; border: 1px solid var(--gold-line);
        }
        .wchip b { font-size: 14px; font-weight: 800; color: var(--lq2); font-variant-numeric: tabular-nums; }
        .wchip.me { color: var(--muted); background: transparent; border-style: dashed; }

        .notice { flex: 0 0 auto; padding: 8px 14px; font-size: 13px; font-weight: 700; color: #7c2d12; background: #fef3c7; border-bottom: 1px solid #fcd34d; }
        .notice[hidden] { display: none; }

        /* ---------- Hội thoại ---------- */
        .log { position: relative; flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
        .row { display: flex; gap: 8px; align-items: flex-end; max-width: 100%; }
        .row.u { justify-content: flex-end; }
        .row .mini { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--gold-2); background: #2a0000; }
        .bub {
            max-width: min(86%, 620px); padding: 11px 14px; border-radius: var(--r); font-size: 14.5px; line-height: 1.55; overflow-wrap: anywhere;
        }
        .row.u .bub { color: #fff; background: linear-gradient(160deg, var(--lq1), var(--lq2)); border-bottom-right-radius: 6px; font-weight: 600; }
        .row.b .bub { background: #fff; border: 1px solid var(--gold-line); border-bottom-left-radius: 6px; box-shadow: 0 6px 18px -12px rgba(120, 50, 0, .45); }
        .bub p + p, .bub p + ul, .bub ul + p, .bub p + .tbl, .bub .tbl + p, .bub ul + .tbl, .bub .tbl + ul { margin-top: 8px; }
        .bub ul { padding-left: 4px; list-style: none; display: flex; flex-direction: column; gap: 5px; }
        .bub li { position: relative; padding-left: 18px; }
        .bub li::before { content: ''; position: absolute; left: 3px; top: .62em; width: 7px; height: 7px; border-radius: 2px; transform: rotate(45deg); background: var(--gold-2); }
        .bub li.ck::before, .bub li.no::before, .bub li.wt::before { display: none; }
        .bub li.ck, .bub li.no, .bub li.wt { padding-left: 24px; }
        .bub li.ck > i, .bub li.no > i, .bub li.wt > i { position: absolute; left: 0; top: 0; font-style: normal; }
        .bub b { color: var(--ink); font-weight: 800; }
        .row.u .bub b { color: #fff; }
        .bub h4 { font-size: 15px; font-weight: 800; color: var(--ink); margin: 2px 0 6px; }
        .bub small, .bub .note { font-size: 12.5px; color: var(--muted); }
        .bub .note { display: block; margin-top: 8px; }
        .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 800; vertical-align: 1px; }
        .tag.ok { color: #065f46; background: #d1fae5; }
        .tag.no { color: #991b1b; background: #fee2e2; }
        .tag.wt { color: #92400e; background: #fef3c7; }
        .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; border-radius: 12px; overflow: hidden; background: var(--cream); border: 1px solid var(--gold-line); }
        .tbl td { padding: 7px 10px; border-top: 1px solid rgba(214, 158, 30, .25); vertical-align: top; }
        .tbl tr:first-child td { border-top: none; }
        .tbl td:last-child { text-align: right; font-weight: 800; color: var(--lq2); white-space: nowrap; }
        .live { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
        .live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
        .live.off::before { background: #9ca3af; }

        .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .act {
            display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 999px; font-size: 13px; font-weight: 800; text-decoration: none;
            color: var(--lq3); background: linear-gradient(135deg, #fff6c8, var(--gold) 55%, var(--gold-2)); box-shadow: 0 4px 10px -6px rgba(150, 80, 0, .8);
        }
        .bub .admnote { margin-top: 10px; padding: 8px 11px; border-radius: 12px; font-size: 13px; font-weight: 700; color: #1e3a8a; background: #e0ecff; border: 1px solid #bfd3fb; }
        .bub .admnote b { color: #1e40af; }
        .act.adm { color: #fff; background: linear-gradient(160deg, #2563eb, #1e3a8a); }
        .act.ghost { color: var(--ink); background: #fff; border: 1px solid var(--gold-line); box-shadow: none; }
        .act:active { transform: scale(.96); }

        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 10px; }
        @media (min-width: 520px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        .gbtn {
            display: flex; align-items: center; gap: 8px; padding: 10px 11px; border-radius: 14px; text-align: left; min-width: 0;
            font-size: 13px; font-weight: 700; line-height: 1.25; color: var(--text); background: var(--cream); border: 1px solid var(--gold-line);
        }
        .gbtn span { flex: 0 0 auto; font-size: 18px; }
        .gbtn:active { transform: scale(.97); background: #fff3c4; }

        .typing { display: inline-flex; gap: 5px; padding: 14px 16px; }
        .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold-2); animation: tp 1s ease-in-out infinite; }
        .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
        @keyframes tp { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-5px); opacity: 1; } }
        .row.in { animation: rin .28s ease-out both; }
        @keyframes rin { from { opacity: 0; transform: translateY(8px); } }
        .bub.reveal > * { animation: rin .3s ease-out both; }

        /* ---------- Gợi ý + ô nhập ---------- */
        .sugg { flex: 0 0 auto; display: flex; gap: 6px; padding: 8px 12px 2px; overflow-x: auto; scrollbar-width: none; }
        .sugg::-webkit-scrollbar { display: none; }
        .chip {
            flex: 0 0 auto; padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap;
            color: var(--ink); background: #fff; border: 1px solid var(--gold-line);
        }
        .chip:active { background: #fff3c4; }
        .composer { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; padding: 8px 12px max(10px, env(safe-area-inset-bottom)); }
        .composer input {
            flex: 1 1 auto; min-width: 0; height: 46px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 600; outline: none;
            background: #fff; border: 1.5px solid var(--gold-line);
        }
        .composer input:focus { border-color: var(--lq1); box-shadow: 0 0 0 3px rgba(212, 35, 48, .14); }
        .send {
            flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--gold); background: linear-gradient(160deg, var(--lq1), var(--lq2)); border: 2px solid var(--gold-2);
        }
        .send svg { width: 20px; height: 20px; }
        .send:disabled { opacity: .5; }
        .foot { flex: 0 0 auto; text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); padding: 0 12px 6px; margin-top: -4px; }

        /* ---------- Bảng dạy AI (Ban Quản Trị) ---------- */
        .ov { position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-end; justify-content: center; background: rgba(40, 5, 0, .55); }
        .ov.show { display: flex; }
        @media (min-width: 640px) { .ov { align-items: center; padding: 20px; } }
        .sheet {
            width: 100%; max-width: 640px; max-height: 92vh; display: flex; flex-direction: column; border-radius: 22px 22px 0 0; overflow: hidden;
            background: var(--paper-solid); border: 1.5px solid var(--gold-line); box-shadow: 0 -10px 40px rgba(0, 0, 0, .35);
        }
        @media (min-width: 640px) { .sheet { border-radius: 22px; } }
        .sh-top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: linear-gradient(160deg, var(--lq1), var(--lq2)); color: #fff; border-bottom: 2px solid var(--gold-2); }
        .sh-top b { flex: 1; font-size: 16px; font-weight: 800; }
        .sh-tabs { display: flex; gap: 6px; padding: 10px 14px 0; }
        .sh-tab { padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; color: var(--ink); background: #fff; border: 1px solid var(--gold-line); }
        .sh-tab.on { color: #fff; background: var(--lq1); border-color: var(--lq1); }
        .sh-body { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
        .fld label { display: block; font-size: 12.5px; font-weight: 800; color: var(--ink); margin-bottom: 5px; }
        .fld input, .fld textarea { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--gold-line); background: #fff; font-size: 14px; outline: none; }
        .fld textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
        .fld small { display: block; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
        .btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { padding: 10px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 800; color: #fff; background: linear-gradient(160deg, var(--lq1), var(--lq2)); }
        .btn.alt { color: var(--ink); background: #fff; border: 1px solid var(--gold-line); }
        .btn:disabled { opacity: .55; }
        .item { padding: 11px 12px; border-radius: 14px; background: #fff; border: 1px solid var(--gold-line); font-size: 13.5px; }
        .item .q { font-weight: 800; color: var(--ink); }
        .item .k { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .item .a { margin-top: 6px; white-space: pre-wrap; color: var(--text); max-height: 4.6em; overflow: hidden; }
        .item .btns { margin-top: 8px; }
        .item .btns button { padding: 6px 12px; font-size: 12px; }
        .empty { text-align: center; color: var(--muted); font-weight: 600; font-size: 13.5px; padding: 16px; }

        .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 60; padding: 10px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 800; color: #fff; background: #1f2937; box-shadow: 0 10px 25px rgba(0, 0, 0, .3); opacity: 0; pointer-events: none; transition: opacity .25s; max-width: calc(100vw - 32px); text-align: center; }
        .toast.show { opacity: 1; }
        /* Nút nhạc dùng chung: chuyển lên góc phải phía trên ô nhập để không đè ô gõ câu hỏi */
        #qd-music-btn { left: auto !important; right: max(12px, env(safe-area-inset-right)) !important; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 128px) !important; width: 40px !important; height: 40px !important; opacity: .92; }
        #qd-music-btn .qd-mu-tip { left: auto !important; right: 50px; }
        @media (min-width: 820px) { #qd-music-btn { right: calc(50% - 390px + 14px) !important; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
    </style>
</head>
<body>
    <div class="app" id="app">
        <header class="top">
            <a class="ic-btn" id="btn-back" href="user.html" aria-label="Quay lại" title="Quay lại">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <div class="avatar"><img src="logo.jpg" alt="" onerror="this.style.visibility='hidden'"><span class="badge">AI</span></div>
            <div class="ttl">
                <b>Quân Sư AI</b>
                <small><span class="dot" id="st-dot"></span><span id="st-txt">Đang kết nối dữ liệu...</span></small>
            </div>
            <button type="button" class="ic-btn" id="btn-teach" hidden aria-label="Dạy Trợ Lý AI" title="Dạy Trợ Lý AI (Ban Quản Trị)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button type="button" class="ic-btn" id="btn-new" aria-label="Cuộc trò chuyện mới" title="Cuộc trò chuyện mới">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button type="button" class="ic-btn" id="btn-close" hidden aria-label="Đóng" title="Đóng">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </header>
        <div class="wallet" id="wallet" hidden></div>
        <div class="notice" id="notice" hidden></div>
        <main class="log" id="log" aria-live="polite"></main>
        <div class="sugg" id="sugg"></div>
        <form class="composer" id="composer" autocomplete="off">
            <input id="q" type="text" maxlength="300" placeholder="Hỏi về điểm, lượt quay, lì xì, điểm danh..." aria-label="Câu hỏi cho trợ lý" enterkeyhint="send">
            <button class="send" id="send" type="submit" aria-label="Gửi">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/></svg>
            </button>
        </form>
        <div class="foot">Quân Sư AI đọc cấu hình trực tiếp từ hệ thống · Cần hỗ trợ riêng hãy nhắn Ban Quản Trị</div>
    </div>

    <!-- Bảng dạy AI: chỉ Ban Quản Trị (admin / manager) thấy -->
    <div class="ov" id="teach" role="dialog" aria-modal="true" aria-labelledby="teach-title">
        <div class="sheet">
            <div class="sh-top">
                <b id="teach-title">🧠 Dạy Quân Sư AI</b>
                <button type="button" class="ic-btn" id="teach-x" aria-label="Đóng"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="sh-tabs">
                <button type="button" class="sh-tab on" data-t="faq">Câu trả lời riêng</button>
                <button type="button" class="sh-tab" data-t="miss">Câu chưa trả lời được</button>
                <button type="button" class="sh-tab" data-t="greet">Lời chào</button>
            </div>
            <div class="sh-body" id="teach-body"></div>
        </div>
    </div>
    <div class="toast" id="toast" role="status"></div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script id="qd-ai-js">
    /* ===== QUÂN SƯ AI =====
       - Bộ hiểu câu hỏi tiếng Việt (có dấu / không dấu / gõ sai 1 chữ / viết tắt: ko, dc, kbb, lx, bqt...)
       - Kho kiến thức về toàn bộ cơ chế hệ thống, số liệu lấy TRỰC TIẾP từ settings/* do Admin cấu hình
       - Đã đăng nhập (qd_current_username): xem số dư, việc cần làm hôm nay
       - Ban Quản Trị dạy thêm câu trả lời riêng: settings/ai_config.faqs; câu chưa trả lời được lưu ở ai_unanswered
       - Mở trong khung (nút Hỗ trợ của các trang): các nút hành động nhờ trang mẹ mở đúng chức năng

        var ABBR = { ko: 'khong', k: 'khong', kh: 'khong', hong: 'khong', hok: 'khong', dc: 'duoc', dk: 'dang ky', dky: 'dang ky', bn: 'bao nhieu', bnh: 'bao nhieu', j: 'gi', z: 'vay', v: 'vay',

            nv: 'nhiem vu', sd: 'su dung', ntn: 'nhu the nao', lm: 'lam', mik: 'minh', mjk: 'minh', t: 'toi', e: 'em', ae: 'anh em', pass: 'mat khau', diemdanh: 'diem danh', vongquay: 'vong quay' };
        var VOCAB = Object.create(null);
        function prepKeys(list) {
            list.forEach(function (t) {

            });

        prepKeys(KB); prepKeys(SMALL);
        function lev(a, b) {
            if (Math.abs(a.length - b.length) > 1) return 2;
            var p = [], i, j; for (j = 0; j <= b.length; j++) p[j] = j;
            for (i = 1; i <= a.length; i++) { var prev = p[0]; p[0] = i; for (j = 1; j <= b.length; j++) { var t = p[j]; p[j] = Math.min(p[j] + 1, p[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; } }

    <script>
    /* Phát hiện mất mạng: sự kiện online/offline của trình duyệt + kiểm tra thật định kỳ
       (navigator.onLine có thể báo "có mạng" khi Wi-Fi đã kết nối nhưng không ra được Internet) */
    (function () {
        'use strict';
        if (window.__qdNetGuard) return; window.__qdNetGuard = true;
        var box = document.getElementById('qd-net'), title = document.getElementById('qd-net-title'), sub = document.getElementById('qd-net-sub'), btn = document.getElementById('qd-net-retry');
        var PROBES = ['https://www.gstatic.com/generate_204', 'https://firestore.googleapis.com/', 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/webfonts/fa-brands-400.woff2'];

        function probe(url) {
            return new Promise(function (resolve, reject) {
                var ctrl = window.AbortController ? new AbortController() : null;
                var t = setTimeout(function () { if (ctrl) ctrl.abort(); reject(new Error('timeout')); }, 6000);

            });
        }
        function anyOk() {   // chỉ cần 1 máy chủ phản hồi là có mạng
            return new Promise(function (resolve) {
                var left = PROBES.length;

            });
        }
        function show() {
            if (offline) return; offline = true;
            clearTimeout(okTimer);
            box.classList.remove('ok');
            title.textContent = 'Không có kết nối Internet';
            sub.textContent = 'Vui lòng kiểm tra Wi-Fi hoặc 4G. Hệ thống sẽ tự kết nối lại.';
            box.hidden = false;
        }
        function hide() {
            if (!offline) return; offline = false;
            box.classList.add('ok');
            title.textContent = 'Đã kết nối lại Internet';
            sub.textContent = 'Dữ liệu đang được đồng bộ lại.';
            clearTimeout(okTimer);
            okTimer = setTimeout(function () { box.hidden = true; box.classList.remove('ok'); }, 2500);
        }
        function check() {
            if (checking) return; checking = true;
            if (navigator.onLine === false) { checking = false; fails = 2; show(); return; }
            anyOk().then(function (ok) {

                if (ok) { fails = 0; hide(); }
                else if (++fails >= 2 || offline) show();   // lỗi 2 lần liên tiếp mới báo, tránh báo nhầm
                else setTimeout(check, 3000);
            });
        }

            sub.textContent = 'Đang kiểm tra kết nối...';
            fails = 1; checking = false;

                btn.disabled = false; btn.textContent = 'Thử lại';
                if (offline) sub.textContent = 'Vẫn chưa có mạng. Vui lòng kiểm tra Wi-Fi hoặc 4G.';
            }, 2500);
        });
        // Kiểm tra định kỳ: mất mạng thì 5 giây/lần để báo có mạng lại nhanh; bình thường 20 giây/lần
        (function loop() { setTimeout(function () { if (!document.hidden || offline) check(); loop(); }, offline ? 5000 : 20000); })();
        if (navigator.onLine === false) show();
    })();

            // chọn bài: nghe tiếp bài của trang trước; lần đầu ở chế độ tự động -> bài sau bài nghe lần trước
            var sp = null; try { sp = JSON.parse(sessionStorage.getItem('qd_music_pos') || 'null'); } catch (e) {}
            var start = 0;
            if (M.mode !== 'auto') start = +M.mode;
            else if (sp && TRACKS[sp.i] && Date.now() - sp.at < 15000) start = sp.i;
            else { var last = parseInt(ls('qd_music_last'), 10); start = isNaN(last) ? 0 : last + 1; }
            setTrack(start);
            el.addEventListener('ended', function () { if (M.mode === 'auto') M.next(); });
            el.addEventListener('playing', function () { if (shown !== M.idx) { shown = M.idx; tip('🎵 ' + TRACKS[M.idx].name, 3500); } });
            var b = M.btn = d.createElement('button');
            b.type = 'button'; b.id = 'qd-music-btn'; b.innerHTML = ICON;
            b.addEventListener('click', function (e) { e.stopPropagation(); M.toggle(); });
            d.body.appendChild(el); d.body.appendChild(b);
            try { var t = new Audio(); t.volume = 0.5; M.useGain = Math.abs(t.volume - 0.5) > 0.01 && !!(W.AudioContext || W.webkitAudioContext); } catch (e) {}
            vol(M.vol);
            el.addEventListener('play', ui); el.addEventListener('pause', ui);
            el.addEventListener('error', function () { M.active = false; M.waiting = false; if (M.btn) M.btn.style.display = 'none'; });
            // nghe tiếp đoạn nhạc từ trang trước
            el.addEventListener('loadedmetadata', function () {
                try {
                    var s = JSON.parse(sessionStorage.getItem('qd_music_pos') || 'null'), du = el.duration;
                    if (s && s.i === M.idx && du && isFinite(du) && Date.now() - s.at < 15000) { el.currentTime = Math.min(s.t + (Date.now() - s.at) / 1000, du - 0.5); shown = M.idx; }
                } catch (e) {}
            }, { once: true });
            W.addEventListener('pagehide', function () {
                try { if (!el.paused) sessionStorage.setItem('qd_music_pos', JSON.stringify({ i: M.idx, t: el.currentTime, at: Date.now() })); else sessionStorage.removeItem('qd_music_pos'); } catch (e) {}
            });
            d.addEventListener('visibilitychange', function () {
                if (d.hidden) { if (!el.paused) { M.hid = true; el.pause(); } return; }
                if (M.hid) { M.hid = false; if (M.enabled && M.active) M.play(false); }
            });
            // đổi âm lượng / bật tắt ở tab khác (trang user) -> áp dụng ngay
            W.addEventListener('storage', function (e) {
                if (e.key === 'qd_music_vol') { M.vol = readVol(); clearInterval(fadeT); vol(M.vol); }
                else if (e.key === 'qd_music_on') { M.enabled = e.newValue !== '0'; if (!M.enabled) M.stop(); }
                else if (e.key === 'qd_music_track') {
                    M.mode = readMode(); el.loop = M.mode !== 'auto';
                    if (M.mode !== 'auto' && +M.mode !== M.idx) { var on = !el.paused; setTrack(+M.mode); if (on) M.play(true); }
                }
            });
            ui();
            if (M.enabled) M.play(false);   // mặc định: vào trang là bật nhạc
        }
        if (d.readyState === 'loading') d.addEventListener('DOMContentLoaded', boot); else boot();
    })();
    </script>
