    <script id="qd-smooth-js">
/* ===== QD SMOOTH: lớp tối ưu mượt mà dùng chung mọi trang =====
   - Giữ luồng chính (main thread) rảnh: hiệu ứng lặp chạy trên GPU, ghi DOM trùng lặp bị bỏ qua
   - Hiệu ứng nằm ngoài màn hình / video nền khuất -> tạm dừng, hiện lại -> chạy tiếp
   - Máy yếu hoặc đo thấy rớt khung hình -> tự bật chế độ nhẹ (html.qd-lite)
   Ép chế độ: localStorage.setItem('qd_fx', 'full' | 'lite' | 'auto') */
(function () {
    'use strict';
    if (window.QDSmooth) return;
    var W = window, d = document, html = d.documentElement, nav = navigator;
    var Q = W.QDSmooth = { lite: false, _cb: [] };

    var pref = store('ls');

    /* ---------- 1. Chế độ nhẹ ---------- */
    Q.onLite = function (fn) { Q._cb.push(fn); if (Q.lite) { try { fn(true); } catch (e) {} } };
    Q.setLite = function (on) {
        on = !!on; if (Q.lite === on) return;
        Q.lite = on; html.classList.toggle('qd-lite', on); store('ss', on ? 'lite' : 'full');
        Q._cb.forEach(function (fn) { try { fn(on); } catch (e) {} });
    };
    var reduce = W.matchMedia && W.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var conn = nav.connection || {};
    var weak = (nav.deviceMemory && nav.deviceMemory <= 2) || (nav.hardwareConcurrency && nav.hardwareConcurrency <= 2) || conn.saveData === true;
    if (pref !== 'full' && (pref === 'lite' || store('ss') === 'lite' || weak || reduce)) Q.setLite(true);

    /* Đo khung hình thật: 2 lần đo liên tiếp rớt > 22% khung -> bật chế độ nhẹ cho phiên này */
    function monitor() {
        if (pref === 'full' || pref === 'lite' || Q.lite || !W.requestAnimationFrame) return;
        var strikes = 0, runs = 0;
        function sample() {
            if (Q.lite || runs > 40) return;

            });

    <script>
    /* Phát hiện mất mạng: sự kiện online/offline của trình duyệt + kiểm tra thật định kỳ
       (navigator.onLine có thể báo "có mạng" khi Wi-Fi đã kết nối nhưng không ra được Internet) */
    (function () {
        'use strict';
        if (window.__qdNetGuard) return; window.__qdNetGuard = true;
        var box = document.getElementById('qd-net'), title = document.getElementById('qd-net-title'), sub = document.getElementById('qd-net-sub'), btn = document.getElementById('qd-net-retry');
        var PROBES = ['https://www.gstatic.com/generate_204', 'https://firestore.googleapis.com/', 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/webfonts/fa-brands-400.woff2'];

        function anyOk() {   // chỉ cần 1 máy chủ phản hồi là có mạng

        }

            box.classList.remove('ok');
            title.textContent = 'Không có kết nối Internet';
            sub.textContent = 'Vui lòng kiểm tra Wi-Fi hoặc 4G. Hệ thống sẽ tự kết nối lại.';
            box.hidden = false;
        }
        function hide() {
            if (!offline) return; offline = false;
            box.classList.add('ok');
            title.textContent = 'Đã kết nối lại Internet';
            sub.textContent = 'Dữ liệu đang được đồng bộ lại.';
            clearTimeout(okTimer);
            okTimer = setTimeout(function () { box.hidden = true; box.classList.remove('ok'); }, 2500);
        }

            }, 2500);
        });

        (function loop() { setTimeout(function () { if (!document.hidden || offline) check(); loop(); }, offline ? 5000 : 20000); })();

        function setTrack(i) {
            var n = TRACKS.length; i = ((i % n) + n) % n;
            M.idx = i; M.el.loop = M.mode !== 'auto';
            var url = new URL(TRACKS[i].src, location.href).href;
            if (M.el.src !== url) M.el.src = url;
            ls('qd_music_last', String(i));
        }
        M.next = function () { var on = !M.el.paused || M.active; setTrack(M.idx + 1); if (on && M.enabled) M.play(true); };
        function vol(v) {
            var x = Math.min(100, Math.max(0, v)) / 100; x = x * x;   // 50% -> 25%: nghe tự nhiên hơn
            if (M.gain) { try { M.gain.gain.setTargetAtTime(x, M.ctx.currentTime, 0.03); } catch (e) { M.gain.gain.value = x; } M.el.volume = 1; }
            else if (M.el) M.el.volume = x;
        }
        var fadeT = 0;
        function fadeIn() {
            var t0 = performance.now(); clearInterval(fadeT); vol(0);
            fadeT = setInterval(function () { var k = Math.min(1, (performance.now() - t0) / 1200); vol(M.vol * k); if (k >= 1) clearInterval(fadeT); }, 50);
        }
        // iPhone/iPad không cho JS chỉnh audio.volume -> đi qua Web Audio (phải tạo trong lúc người dùng chạm)
        function setupGain() {
            if (!M.useGain || M.gain) return;
            try {
                var AC = W.AudioContext || W.webkitAudioContext; M.ctx = new AC();
                var src = M.ctx.createMediaElementSource(M.el); M.gain = M.ctx.createGain();
                src.connect(M.gain); M.gain.connect(M.ctx.destination); vol(M.vol);
            } catch (e) { M.useGain = false; M.gain = null; }
        }
        var GEST = ['touchend', 'click', 'keydown', 'mousedown'], tipT = 0, shown = -1;
        function tip(text, ms) {
            var b = M.btn; if (!b) return;
            b.querySelector('.qd-mu-tip').textContent = text;
            clearTimeout(tipT); b.classList.add('tip'); tipT = setTimeout(function () { b.classList.remove('tip'); }, ms);
        }
        function wait() {
            if (M.waiting) return; M.waiting = true; ui();
            tip('🎵 Chạm để bật nhạc Tết', 6000);
            GEST.forEach(function (ev) { d.addEventListener(ev, go, true); });
        }
        function go(e) {
            if (e && e.target && e.target.closest && e.target.closest('#qd-music-btn')) return;   // bấm nút: để nút tự xử lý
            GEST.forEach(function (ev) { d.removeEventListener(ev, go, true); });
            M.waiting = false;
            if (M.enabled && M.active && M.el.paused) M.play(true); else ui();
        }
        M.play = function (gesture) {
            var el = M.el; M.active = true;
            if (d.hidden) { M.hid = true; return; }
            if (M.useGain && !M.gain) { if (!gesture) return wait(); setupGain(); }
            if (M.ctx && M.ctx.state !== 'running') { try { M.ctx.resume(); } catch (e) {} }
            if (!el.paused) return ui();
            fadeIn();
            var p = el.play();
            if (p && p.then) p.then(function () {
                M.waiting = false; GEST.forEach(function (ev) { d.removeEventListener(ev, go, true); }); ui();
            }, function (err) {
                if (err && err.name === 'NotAllowedError') { M.waiting = false; return wait(); }
                M.active = false; ui();
            });
        };
        M.stop = function () { M.active = false; clearInterval(fadeT); if (M.el) M.el.pause(); ui(); };
        M.toggle = function () {
            if (M.el.paused) { M.enabled = true; ls('qd_music_on', '1'); M.play(true); }
            else { M.enabled = false; ls('qd_music_on', '0'); M.stop(); }
        };

        function boot() {
            var st = d.createElement('style'); st.id = 'qd-music-css'; st.textContent = CSS; d.head.appendChild(st);
            var el = M.el = d.createElement('audio');
            el.id = 'qd-music'; el.preload = 'auto'; el.setAttribute('playsinline', '');
            // chọn bài: nghe tiếp bài của trang trước; lần đầu ở chế độ tự động -> bài sau bài nghe lần trước
            var sp = null; try { sp = JSON.parse(sessionStorage.getItem('qd_music_pos') || 'null'); } catch (e) {}
            var start = 0;
            if (M.mode !== 'auto') start = +M.mode;
            else if (sp && TRACKS[sp.i] && Date.now() - sp.at < 15000) start = sp.i;
            else { var last = parseInt(ls('qd_music_last'), 10); start = isNaN(last) ? 0 : last + 1; }
            setTrack(start);
            el.addEventListener('ended', function () { if (M.mode === 'auto') M.next(); });
            el.addEventListener('playing', function () { if (shown !== M.idx) { shown = M.idx; tip('🎵 ' + TRACKS[M.idx].name, 3500); } });
            var b = M.btn = d.createElement('button');
            b.type = 'button'; b.id = 'qd-music-btn'; b.innerHTML = ICON;
            b.addEventListener('click', function (e) { e.stopPropagation(); M.toggle(); });
            d.body.appendChild(el); d.body.appendChild(b);
            try { var t = new Audio(); t.volume = 0.5; M.useGain = Math.abs(t.volume - 0.5) > 0.01 && !!(W.AudioContext || W.webkitAudioContext); } catch (e) {}
            vol(M.vol);
            el.addEventListener('play', ui); el.addEventListener('pause', ui);
            el.addEventListener('error', function () { M.active = false; M.waiting = false; if (M.btn) M.btn.style.display = 'none'; });
            // nghe tiếp đoạn nhạc từ trang trước
            el.addEventListener('loadedmetadata', function () {
                try {
                    var s = JSON.parse(sessionStorage.getItem('qd_music_pos') || 'null'), du = el.duration;
                    if (s && s.i === M.idx && du && isFinite(du) && Date.now() - s.at < 15000) { el.currentTime = Math.min(s.t + (Date.now() - s.at) / 1000, du - 0.5); shown = M.idx; }
                } catch (e) {}
            }, { once: true });
            W.addEventListener('pagehide', function () {
                try { if (!el.paused) sessionStorage.setItem('qd_music_pos', JSON.stringify({ i: M.idx, t: el.currentTime, at: Date.now() })); else sessionStorage.removeItem('qd_music_pos'); } catch (e) {}
            });
            d.addEventListener('visibilitychange', function () {
                if (d.hidden) { if (!el.paused) { M.hid = true; el.pause(); } return; }
                if (M.hid) { M.hid = false; if (M.enabled && M.active) M.play(false); }
            });
            // đổi âm lượng / bật tắt ở tab khác (trang user) -> áp dụng ngay
            W.addEventListener('storage', function (e) {
                if (e.key === 'qd_music_vol') { M.vol = readVol(); clearInterval(fadeT); vol(M.vol); }
                else if (e.key === 'qd_music_on') { M.enabled = e.newValue !== '0'; if (!M.enabled) M.stop(); }
                else if (e.key === 'qd_music_track') {
                    M.mode = readMode(); el.loop = M.mode !== 'auto';
                    if (M.mode !== 'auto' && +M.mode !== M.idx) { var on = !el.paused; setTrack(+M.mode); if (on) M.play(true); }
                }
            });
            ui();
            if (M.enabled) M.play(false);   // mặc định: vào trang là bật nhạc
        }
        if (d.readyState === 'loading') d.addEventListener('DOMContentLoaded', boot); else boot();
    })();
    </script>
</body>
</html>
