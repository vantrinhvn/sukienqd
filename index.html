<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Web của tôi</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('anhnen.jpg') no-repeat center center/cover;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Nút đăng ký */
        .register-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            background-color: #e60000;
        }
    </style>
</head>
<body>

    <button class="register-btn">Đăng ký</button>

</body>
</html>
