<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sự kiện QD</title>

<meta property="og:title" content="Sự kiện QD - Đăng ký ngay">
<meta property="og:description" content="Tham gia sự kiện và đăng ký nhanh chóng">
<meta property="og:image" content="https://vantrinhvn.github.io/sukienqd/anhnen.jpg">
<meta property="og:url" content="https://vantrinhvn.github.io/sukienqd/">
<meta property="og:type" content="website">

<style>
body {
    margin: 0;
    background: url('anhnen.jpg') no-repeat center/cover;
    height: 100vh;
    font-family: Arial;
}

/* Nút đăng ký */
.register-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 20px;
    background: red;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

/* Form */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    backdrop-filter: blur(10px);
    justify-content: center;
    align-items: center;
}

.form-box {
    background: rgba(0,0,0,0.6);
    padding: 25px;
    border-radius: 15px;
    backdrop-filter: blur(15px);
    color: white;
    text-align: center;
    width: 260px;
}

input {
    display: block;
    margin: 10px auto;
    padding: 10px;
    width: 100%;
    border-radius: 8px;
    border: none;
}

.form-box button {
    margin: 8px 5px 0;
    padding: 8px 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<button class="register-btn" onclick="openForm()">Đăng ký</button>

<div class="modal" id="modal">
    <div class="form-box">
        <h3>Đăng ký</h3>
        <input id="name" placeholder="Họ tên">
        <input id="gameId" placeholder="ID Game">

        <button id="submitBtn" onclick="register()">Xác nhận</button>
        <button onclick="closeForm()">Đóng</button>
    </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ",
  authDomain: "web-dangky-123.firebaseapp.com",
  projectId: "web-dangky-123",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function openForm() {
    document.getElementById('modal').style.display = 'flex';
}

function closeForm() {
    document.getElementById('modal').style.display = 'none';
}

function register() {
    let name = document.getElementById('name').value;
    let gameId = document.getElementById('gameId').value;
    let btn = document.getElementById("submitBtn");

    if (!name || !gameId) {
        alert("Nhập đầy đủ!");
        return;
    }

    let savedId = localStorage.getItem("gameId");

    // 🔒 kiểm tra thiết bị đã đăng ký chưa
    if (savedId) {
        db.collection("users")
        .where("gameId", "==", savedId)
        .get()
        .then((snapshot) => {

            if (!snapshot.empty) {
                alert("❌ Bạn đã đăng ký rồi!");
                return;
            } else {
                // admin đã xóa → reset
                localStorage.removeItem("gameId");
                register();
            }
        });

        return;
    }

    // 🔍 kiểm tra trùng ID
    db.collection("users")
    .where("gameId", "==", gameId)
    .get()
    .then((snapshot) => {

        if (!snapshot.empty) {
            alert("❌ ID này đã tồn tại!");
            return;
        }

        // khóa nút
        btn.disabled = true;
        btn.innerText = "Đang xử lý...";

        // delay 5s
        setTimeout(() => {
            db.collection("users").add({
                name: name,
                gameId: gameId,
                time: new Date()
            })
            .then(() => {
                localStorage.setItem("gameId", gameId);
                alert("✅ Đăng ký thành công!");
                closeForm();
            })
            .catch(err => {
                console.error(err);
                alert("Lỗi Firebase!");
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Xác nhận";
            });
        }, 5000);

    });
}
</script>

</body>
</html>
