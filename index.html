<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    
    <!-- Quan trọng cho mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web của tôi</title>

    <style>
        body {
            margin: 0;
            padding: 0;

            /* Ảnh nền chuẩn mobile */
            background-image: url('anhnen.jpg');
            background-size: cover;        /* phủ full màn */
            background-position: center;   /* căn giữa */
            background-repeat: no-repeat;
            background-attachment: fixed;  /* mượt hơn */

            height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Nút đăng ký */
        .register-btn {
            position: fixed;
    bottom: 20px;   /* xuống dưới */
    right: 20px;    /* vẫn bên phải */

    padding: 10px 18px;
    background-color: #ff4d4d;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;

    cursor: pointer;

        }

        .register-btn:hover {
            background-color: #e60000;
        }

        /* Responsive cho màn nhỏ */
        @media (max-width: 600px) {
            .register-btn {
                font-size: 13px;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>

    <button class="register-btn">Đăng ký</button>

</body>
</html>
