<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sự kiện QD</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    overflow:hidden;
   background:url("anhnen.jpg") no-repeat center/cover;
}

/* background image */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:url('anhnen.jpg') center/cover;
    opacity:0.25;
    z-index:-1;
}

/* ===== BUTTON AREA (TÁCH + DI CHUYỂN) ===== */
.button-area{
    position:fixed;
    top:80%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    gap:80px; /* 👈 chỉnh khoảng cách 2 nút ở đây */
}

/* BUTTON */
.btn{
    padding:16px 26px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
    min-width:170px;
    font-size:16px;
}

/* màu nút */
.register-btn{
    background:linear-gradient(45deg,#00ff99,#00d4ff);
}

.login-btn{
    background:linear-gradient(45deg,#ffffff, #c497ab);
}

.btn:hover{
    transform:scale(1.08);
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    justify-content:center;
    align-items:center;
    backdrop-filter: blur(10px);
}

/* FORM */
.form-box{
    width:340px;
    padding:28px;
    border-radius:18px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 0 25px rgba(0,0,0,0.4);
    text-align:center;
    color:white;
}

h3{
    margin-bottom:15px;
}

input{
    width:92%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    outline:none;
    background:rgba(255,255,255,0.2);
    color:white;
}

input::placeholder{
    color:#ddd;
}

.form-box button{
    margin:6px;
    padding:10px 14px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.confirm{
    background:#00ff99;
}

.close{
    background:#ff4d4d;
    color:white;
}
</style>
</head>

<body>

<!-- ===== BUTTONS ===== -->
<div class="button-area">
    <button class="btn register-btn" onclick="openForm()">Đăng ký</button>
    <button class="btn login-btn" onclick="openLogin()">Đăng nhập</button>
</div>

<!-- REGISTER -->
<div class="modal" id="modal">
    <div class="form-box">
        <h3>🔥 Đăng ký sự kiện</h3>

        <input id="name" placeholder="Họ tên">

        <input id="gameId" type="text" inputmode="numeric"
        placeholder="ID Game"
        oninput="this.value=this.value.replace(/[^0-9]/g,'')">

        <button class="confirm" onclick="register()">Xác nhận</button>
        <button class="close" onclick="closeForm()">Đóng</button>
    </div>
</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
    <div class="form-box">
        <h3>🔐 Đăng nhập</h3>

        <input id="loginUser" placeholder="Tài khoản">
        <input id="loginPass" type="password" placeholder="Mật khẩu">

        <button class="confirm" onclick="login()">Đăng nhập</button>
        <button class="close" onclick="closeLogin()">Đóng</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ",
  authDomain: "web-dangky-123.firebaseapp.com",
  projectId: "web-dangky-123",
});

const db = firebase.firestore();

/* ===== OPEN / CLOSE ===== */
function openForm(){
    document.getElementById("modal").style.display="flex";
}
function closeForm(){
    document.getElementById("modal").style.display="none";
}
function openLogin(){
    document.getElementById("loginModal").style.display="flex";
}
function closeLogin(){
    document.getElementById("loginModal").style.display="none";
}

/* ===== REGISTER (30 phút cooldown) ===== */
function register(){
    let name = document.getElementById("name").value;
    let gameId = document.getElementById("gameId").value;
    let btn = document.querySelector("#modal .confirm");

    let lastTime = localStorage.getItem("last_register_time");
    let now = Date.now();
    let limit = 30 * 60 * 1000;

    if(lastTime && (now - parseInt(lastTime)) < limit){
        let remain = Math.ceil((limit - (now - parseInt(lastTime))) / 60000);
        alert("⏳ Bạn phải chờ " + remain + " phút nữa!");
        return;
    }

    if(!name || !gameId){
        alert("❌ Nhập đầy đủ!");
        return;
    }

    btn.disabled = true;
    btn.innerText = "Đang xử lý...";

    db.collection("users")
    .where("gameId","==",gameId)
    .get()
    .then(snap => {

        if(!snap.empty){
            alert("❌ ID đã tồn tại!");
            btn.disabled = false;
            btn.innerText = "Xác nhận";
            return;
        }

        db.collection("users").add({
            name:name,
            gameId:gameId,
            time:new Date()
        })
        .then(() => {

            localStorage.setItem("last_register_time", Date.now());

            alert("✅ Đăng ký thành công!");
            closeForm();

            document.getElementById("name").value="";
            document.getElementById("gameId").value="";
        })
        .finally(()=>{
            btn.disabled=false;
            btn.innerText="Xác nhận";
        });
    });
}

/* ===== LOGIN ===== */
function login(){
    let u=document.getElementById("loginUser").value;
    let p=document.getElementById("loginPass").value;

    db.collection("accounts")
    .where("user","==",u)
    .where("pass","==",p)
    .get()
    .then(snap=>{
        if(snap.empty){
            alert("❌ Sai tài khoản!");
            return;
        }

        let data=snap.docs[0].data();

        alert("✅ Đăng nhập thành công!");

        if(data.role==="admin"){
            window.location.href="admin.html";
        }else{
            window.location.href="user.html";
        }
    });
}
</script>

</body>
</html>
