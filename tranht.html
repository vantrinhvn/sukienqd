<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>QD Elite - Tranh Thưởng May Mắn</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* (Giữ nguyên toàn bộ phần CSS cũ của bạn) */
        :root {
            --brand-primary: #4f46e5; --brand-primary-hover: #4338ca;
            --color-warning: #f59e0b; --color-success: #10b981; --color-danger: #ef4444;
            --color-gold: #ffd700; --color-gold-glow: rgba(255, 215, 0, 0.4);
            --bg-body: #09090b; --bg-surface: #121217; --bg-elevated: #1e1e26;
            --border-strong: #3f3f46; --text-main: #f4f4f5; --text-muted: #a1a1aa;
            --radius-md: 12px; --radius-xl: 24px; --radius-full: 9999px;
            --shadow-lg: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
            --transition-fast: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --transition-bounce: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; outline: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; 
            background-image: radial-gradient(circle at 50% 0%, rgba(239, 68, 68, 0.1) 0%, transparent 70%);
        }
        .app-header {
            padding: 15px 5%; background-color: rgba(18, 18, 23, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        .header-brand { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px; letter-spacing: -0.5px; }
        .header-brand i { color: var(--color-danger); text-shadow: 0 0 20px rgba(239, 68, 68, 0.8); font-size: 26px;}
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: var(--radius-md); font-weight: 700; font-size: 14px; cursor: pointer; transition: var(--transition-fast); border: 1px solid transparent; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
        .btn-outline { border-color: var(--border-strong); color: var(--text-main); background: transparent; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4); border: none; }
        .main-wrapper { flex: 1; padding: 50px 5%; max-width: 1100px; margin: 0 auto; width: 100%; }
        .title-box { text-align: center; margin-bottom: 60px; animation: fadeInDown 0.8s ease; }
        .title-box h1 { font-size: 42px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; background: linear-gradient(to right, #ff416c, #ff4b2b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 15px rgba(255, 75, 43, 0.4)); }
        .spin-counter { display: inline-flex; align-items: center; gap: 10px; margin-top: 25px; padding: 12px 30px; background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: var(--radius-full); color: var(--color-danger); font-weight: 800; font-size: 18px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); backdrop-filter: blur(5px); }
        .ticket-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; justify-content: center; }
        .ticket-container { position: relative; width: 100%; height: 160px; cursor: pointer; perspective: 1200px; border-radius: 16px; transition: transform var(--transition-bounce); animation: zoomIn 0.5s ease backwards; }
        .ticket-back { position: absolute; inset: 0; background: linear-gradient(180deg, #1e1e26 0%, #121217 100%); border: 2px dashed rgba(255, 215, 0, 0.5); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5); opacity: 0; transform: scale(0.9); transition: all 0.4s ease; }
        .ticket-back h3 { color: var(--color-gold); font-size: 24px; font-weight: 900; margin-top: 10px; text-shadow: 0 0 15px var(--color-gold-glow); text-transform: uppercase; }
        .ticket-front { position: absolute; inset: 0; display: flex; z-index: 2; pointer-events: none; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
        .ticket-half { flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.95); font-size: 35px; transition: all 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55); position: relative; }
        .half-left { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); border-radius: 16px 0 0 16px; border-right: 2px dashed rgba(0,0,0,0.3); transform-origin: left center; }
        .half-right { background: linear-gradient(135deg, #ffb199 0%, #ff0844 100%); border-radius: 0 16px 16px 0; border-left: 1px dashed rgba(255,255,255,0.5); transform-origin: right center; left: -1px; }
        .ticket-container.opened .half-left { transform: translateX(-100%) rotate(-25deg); opacity: 0; }
        .ticket-container.opened .half-right { transform: translateX(100%) rotate(25deg); opacity: 0; }
        .ticket-container.opened .ticket-back { opacity: 1; transform: scale(1); }
        .ticket-container.disabled { filter: grayscale(0.8) brightness(0.5); opacity: 0.6; cursor: not-allowed; pointer-events: none; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; z-index: 2000; opacity: 0; transition: 0.3s; padding: 20px; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-box { background: linear-gradient(to bottom, var(--bg-surface), var(--bg-elevated)); padding: 40px; border-radius: var(--radius-xl); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1); width: 100%; max-width: 480px; transform: scale(0.9) translateY(20px); transition: var(--transition-bounce); position: relative; }
        .modal-overlay.active .modal-box { transform: scale(1) translateY(0); }
        .modal-close { position: absolute; top: 20px; right: 20px; width: 36px; height: 36px; border-radius: var(--radius-full); background: rgba(255,255,255,0.05); border: none; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition-fast); font-size: 16px; }
        .history-list { max-height: 400px; overflow-y: auto; margin-top: 20px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 18px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02); border-radius: var(--radius-md); margin-bottom: 12px; transition: var(--transition-fast); }
        #toast-container { position: fixed; top: 24px; right: 24px; z-index: 3000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .toast { min-width: 320px; background: var(--bg-surface); border: 1px solid var(--border-strong); padding: 16px 20px; border-radius: var(--radius-md); display: flex; align-items: center; gap: 16px; transform: translateX(120%); transition: 0.5s; }
        .toast.show { transform: translateX(0); }
        @keyframes pulseDanger { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        .flex { display: flex; } .items-center { align-items: center; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .w-full { width: 100%; } .text-center { text-align: center; } .flex-col { display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <header class="app-header">
        <div class="header-brand">
            <i class="fa-solid fa-ticket-alt"></i> TRANH THƯỞNG
        </div>
        <div class="flex gap-3">
            <button class="btn btn-outline" onclick="History.openModal()" style="border-radius: var(--radius-full);">
                <i class="fa-solid fa-clock-rotate-left"></i> <span class="hidden-mobile">Lịch Sử</span>
            </button>
            <button class="btn btn-outline" onclick="window.location.href='user.html'" style="border-radius: var(--radius-full); padding: 12px 16px;" title="Về trang chủ">
                <i class="fa-solid fa-house"></i>
            </button>
        </div>
    </header>

    <main class="main-wrapper">
        <div class="title-box">
            <h1>Rút Thăm Bí Mật</h1>
            <p>Chào <b class="text-danger" id="player-name">User</b>! Chọn ngay 1 trong 6 thẻ bài để xé và lật mở quà.</p>
            
            <div class="spin-counter" id="spin-counter-box">
                <i class="fa-solid fa-bolt"></i> 
                <span>Lượt xé khả dụng:</span> 
                <span id="ticket-count-val" style="font-size: 22px; margin-left: 5px;"><i class="fa-solid fa-spinner fa-spin"></i></span>
            </div>
        </div>

        <div class="ticket-grid" id="ticket-grid-ui"></div>
    </main>

    <div class="modal-overlay" id="modal-result">
        <div class="modal-box text-center">
            <div style="font-size: 80px; color: var(--color-gold); margin-bottom: 10px; text-shadow: 0 0 40px var(--color-gold-glow);">
                <i class="fa-solid fa-crown"></i>
            </div>
            <h2 style="font-size: 32px; margin-bottom: 5px; color: #fff; font-weight: 900; letter-spacing: 1px;">BẠN ĐÃ XÉ TRÚNG!</h2>
            <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 20px;">Phần thưởng bí mật bên trong thẻ là:</p>
            <div style="padding: 25px; background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05)); border-radius: var(--radius-lg); border: 1px solid rgba(245, 158, 11, 0.4); margin-bottom: 30px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);">
                <h3 id="prizeText" style="font-size: 28px; color: var(--color-gold); margin: 0; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,215,0,0.5);">Tên Phần Thưởng</h3>
            </div>
            <button class="btn btn-danger w-full" style="padding: 18px; font-size: 16px; border-radius: var(--radius-full);" onclick="TranhThuong.closeModal()">
                <i class="fa-solid fa-check mr-2"></i> XÁC NHẬN NHẬN QUÀ
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="modal-history">
        <div class="modal-box" style="padding: 30px; text-align: left;">
            <button class="modal-close" onclick="History.closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <h2 style="font-size: 24px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; font-weight: 800;">
                <i class="fa-solid fa-clock-rotate-left text-danger"></i> Lịch Sử Nhận Thưởng
            </h2>
            <div class="history-list" id="history-container"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCtn0peiXBsrRRgUZSSVQFrBe-RGgxS6eQ", projectId: "web-dangky-123" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const State = {
            currentUser: localStorage.getItem('qd_current_username'),
            currentDocId: null,
            availableTickets: 0,
            hasPlayed: false,
            // 1. KHỞI TẠO ÂM THANH
            rewardAudio: new Audio('https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3'), 
            prizes: [
                { text: "10.000 VNĐ", chance: 10 },
                { text: "Chúc May Mắn", chance: 30 },
                { text: "Thẻ Cào 20K", chance: 10 },
                { text: "Áo QD Elite", chance: 5 },
                { text: "20.000 VNĐ", chance: 15 },
                { text: "Thêm 1 Lượt", chance: 30 }
            ]
        };

        const Utils = {
            toast: (message, type = 'success') => {
                const container = document.getElementById('toast-container');
                const t = document.createElement('div'); t.className = `toast ${type} show`;
                let iconStr = type === 'error' ? 'fa-circle-xmark' : (type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-check');
                t.innerHTML = `<div style="font-size: 24px; flex-shrink: 0;"><i class="fa-solid ${iconStr}"></i></div><div class="flex-col"><span style="font-size: 14px; font-weight: 600; color: var(--text-main);">${message}</span></div>`;
                container.appendChild(t); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 3000);
            }
        };

        const TranhThuong = {
            init: function() {
                if(!State.currentUser) {
                    alert("SECURITY ALERT: Phiên đăng nhập không hợp lệ.");
                    window.location.href = "user.html"; return;
                }
                document.getElementById('player-name').innerText = State.currentUser;
                this.renderTickets();

                db.collection("settings").doc("tranhthuong_config").onSnapshot(doc => {
                    if (doc.exists && doc.data().prizes) { State.prizes = doc.data().prizes; }
                });

                db.collection("accounts").where("user", "==", State.currentUser).onSnapshot(snap => {
                    if(!snap.empty) {
                        const accountDoc = snap.docs[0];
                        State.currentDocId = accountDoc.id;
                        State.availableTickets = accountDoc.data().tickets || 0;
                        document.getElementById('ticket-count-val').innerText = State.availableTickets;
                        const counterBox = document.getElementById('spin-counter-box');
                        if(State.availableTickets > 0) counterBox.classList.add('glow');
                        else counterBox.classList.remove('glow');
                    }
                });
            },

            renderTickets: function() {
                const grid = document.getElementById('ticket-grid-ui');
                grid.innerHTML = "";
                for(let i = 0; i < 6; i++) {
                    grid.innerHTML += `
                        <div class="ticket-container" id="ticket-${i}" onclick="TranhThuong.openTicket(${i})">
                            <div class="ticket-back">
                                <i class="fa-solid fa-gift text-3xl" style="color: var(--color-gold); opacity: 0.8;"></i>
                                <h3 id="result-${i}">?</h3>
                            </div>
                            <div class="ticket-front">
                                <div class="ticket-half half-left"><i class="fa-solid fa-ticket-alt"></i></div>
                                <div class="ticket-half half-right"></div>
                            </div>
                        </div>
                    `;
                }
            },

            openTicket: function(index) {
                if (State.availableTickets <= 0) {
                    Utils.toast("Bạn đã hết lượt xé phiếu!", "warning");
                    return;
                }
                if (State.hasPlayed) return;
                
                State.hasPlayed = true;

                db.collection("accounts").doc(State.currentDocId).update({
                    tickets: firebase.firestore.FieldValue.increment(-1)
                }).then(() => {
                    let totalChance = 0;
                    State.prizes.forEach(p => totalChance += parseFloat(p.chance) || 0);
                    const rand = Math.random() * totalChance;
                    let sum = 0;
                    let winningPrize = "Chúc May Mắn";

                    for(let i = 0; i < State.prizes.length; i++) {
                        sum += parseFloat(State.prizes[i].chance) || 0;
                        if(rand <= sum) { winningPrize = State.prizes[i].text; break; }
                    }

                    document.getElementById(`result-${index}`).innerText = winningPrize;

                    for(let i=0; i<6; i++) {
                        if(i !== index) document.getElementById(`ticket-${i}`).classList.add('disabled');
                    }

                    const activeTicket = document.getElementById(`ticket-${index}`);
                    activeTicket.classList.add('opened');

                    setTimeout(() => {
                        document.getElementById('prizeText').innerText = winningPrize;
                        const modal = document.getElementById('modal-result');
                        modal.style.display = 'flex'; void modal.offsetWidth; modal.classList.add('active');

                        // 2. PHÁT ÂM THANH KHI MỞ QUÀ
                        State.rewardAudio.currentTime = 0;
                        State.rewardAudio.play().catch(e => console.log("Audio play blocked"));

                        db.collection("tranhthuong_history").add({
                            userId: State.currentUser,
                            result: winningPrize,
                            timestamp: Date.now()
                        });
                    }, 900);

                }).catch(err => {
                    State.hasPlayed = false;
                    Utils.toast("Lỗi kết nối máy chủ.", "error");
                });
            },

            closeModal: function() {
                // 3. TẮT ÂM THANH KHI ĐÓNG CỬA SỔ
                State.rewardAudio.pause();
                State.rewardAudio.currentTime = 0;

                const modal = document.getElementById('modal-result');
                modal.classList.remove('active'); 
                setTimeout(() => {
                    modal.style.display = 'none';
                    State.hasPlayed = false;
                    TranhThuong.renderTickets();
                }, 300);
            }
        };

        const History = {
            openModal: () => {
                const modal = document.getElementById('modal-history');
                modal.style.display = 'flex'; void modal.offsetWidth; modal.classList.add('active');
                History.fetchAndRenderData();
            },
            closeModal: () => {
                const modal = document.getElementById('modal-history');
                modal.classList.remove('active'); setTimeout(() => modal.style.display = 'none', 300);
            },
            fetchAndRenderData: () => {
                const container = document.getElementById('history-container');
                if(!State.currentUser) return;
                db.collection("tranhthuong_history").where("userId", "==", State.currentUser).get().then(snapshot => {
                    if (snapshot.empty) { container.innerHTML = "Chưa có lịch sử."; return; }
                    let records = [];
                    snapshot.forEach(doc => records.push(doc.data()));
                    records.sort((a, b) => b.timestamp - a.timestamp);
                    container.innerHTML = "";
                    records.forEach(item => {
                        const dateObj = new Date(item.timestamp);
                        const dateStr = `${dateObj.getHours()}:${dateObj.getMinutes()} - ${dateObj.toLocaleDateString('vi-VN')}`;
                        container.innerHTML += `<div class="history-item"><div class="flex-col"><b>${item.result}</b><small>${dateStr}</small></div></div>`;
                    });
                });
            }
        };

        document.addEventListener("DOMContentLoaded", () => { TranhThuong.init(); });
    </script>
</body>
</html>
